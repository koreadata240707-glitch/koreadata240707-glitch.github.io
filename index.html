<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한국데이터 매출 대시보드</title>
</head>
<body style="margin:0;font-family:-apple-system,'Malgun Gothic',sans-serif;background:#f5f7fb">
<p id="m" style="text-align:center;margin-top:40vh;color:#64748b">불러오는 중…</p>
<script>
// 화면은 구글(사무실 PC가 올려둔 최신본)에서 받아와서 보여줍니다. 이 파일은 고칠 필요가 없어요.
// 한 번 받은 화면은 이 브라우저에 저장해 두고 다음부터 바로 보여줍니다 (최신본은 화면이 알아서 다시 받아 둠).
var API = 'https://script.google.com/macros/s/AKfycbzs41F3lBV5XdPUTQq8UVgp_NmWE5bmoWWDoGPaQ6zIo2Mr6w6vYcKU_LdUMz7UG2WAbw/exec';
function render(html) {
  // 페이지 읽기가 끝난 뒤에 화면을 바꿔야 '불러오는 중' 글자가 남지 않음
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', function () { render(html); }); return; }
  document.open(); document.write(html); document.close();
}
function load(n) {
  fetch(API, { method: 'POST', body: JSON.stringify({ fn: 'getHtml' }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { try { localStorage.setItem('cd_html', j.result.html); } catch (e) {} render(j.result.html); })
    .catch(function () {
      if (n < 4) { document.getElementById('m').textContent = '불러오는 중… (' + (n + 1) + ')'; setTimeout(function () { load(n + 1); }, 1500); }
      else { document.getElementById('m').textContent = '사이트를 불러오지 못했어요. 잠시 후 새로고침해 주세요.'; }
    });
}
var saved = null;
try {
  // 아주 예전 화면이 저장돼 있으면 버리고 새로 받기 (화면 버전이 바뀔 때 숫자만 올리면 됨)
  if (localStorage.getItem('cd_v') !== '2') { localStorage.removeItem('cd_html'); localStorage.setItem('cd_v', '2'); }
  saved = localStorage.getItem('cd_html');
} catch (e) {}
if (saved) render(saved); else load(0);
</script>
</body>
</html>
