.login-card h1{font-size:20px;margin:0 0 6px}
.login-card p{color:var(--sub);font-size:14px;margin:0 0 22px}
.fld{width:100%;display:block;margin-bottom:10px;padding:12px 14px;font-size:15px}
.fld-btn{width:100%;padding:12px;font-size:15px}
.login-card a{color:var(--brand);font-weight:600;text-decoration:none}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.login-err{color:var(--bad);font-size:13px;min-height:20px;margin-top:12px}

/* 앱 레이아웃 */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top .logo{width:38px;height:38px;margin:0}
.top h2{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:13px;color:var(--sub);white-space:nowrap}
.btn-ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer}
nav{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:10px 12px;font-size:14px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:1180px;margin:0 auto;padding:16px}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.banner.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.banner.info{background:var(--brand-soft);color:#1e40af}
.updated{font-size:13px;color:var(--sub);margin:0 0 12px}

const won = n => (n==null||n==='')?'-':Math.round(Number(n)).toLocaleString('ko-KR');

  if(a>=1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'')+'억';
  if(a>=1e4) return Math.round(n/1e4).toLocaleString('ko-KR')+'만';
  return Math.round(n).toLocaleString('ko-KR');};

const IN_GAS = typeof google!=='undefined' && google.script && google.script.run;
function call(fn, ...args){
  const done=(r,res,rej)=>{
    if(r && r.authError){ logout(true); rej(new Error('다시 로그인해 주세요')); return; }
    if(r && r.error){ rej(new Error(r.error)); return; }
    res(r);
  };
  return new Promise((res,rej)=>{
    if(IN_GAS){
      google.script.run.withSuccessHandler(r=>done(r,res,rej)).withFailureHandler(e=>rej(e))[fn](...args);
      return;
    }
    // 외부 주소(GitHub Pages)에서 열었을 때: 구글 API로 직접 호출
    const go=()=>fetch(API_URL,{method:'POST',body:JSON.stringify({fn,args})}).then(r=>r.json());
    const wait=ms=>new Promise(r=>setTimeout(r,ms));
    go().catch(()=>wait(1500).then(go)).catch(()=>wait(3000).then(go)).catch(()=>wait(5000).then(go))
      .then(j=>{ if(j.error){rej(new Error(j.error));return;} done(j.result,res,rej); })
      .catch(()=>rej(new Error('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.')));
  });
}

/* 알림 종: 수집 프로그램이 요약지표 '알림' 칸에 넣은 Wing 알림·미답변 문의·계정 제재 */
let BELL_TAB='전체';
function bellData(){try{return JSON.parse((DATA&&DATA.kpi&&DATA.kpi['알림'])||'{}')}catch(e){return {}}}
function bellKey(it){return it.type+'|'+it.title+'|'+(it.text||'')+'|'+(it.count||'')}
function bellSeen(){try{return JSON.parse(localStorage.getItem('cd_bell_seen')||'[]')}catch(e){return []}}
function drawBell(){
  const B=bellData(),items=B.items||[],seen=new Set(bellSeen());
  const unread=items.filter(it=>!seen.has(bellKey(it))).length;
  const c=$('bellCnt');if(c){c.hidden=!unread;c.textContent=unread>99?'99+':unread;}
  const p=$('bellPanel');if(!p||p.hidden)return;
  const kinds=['전체','문의','센터','Wing','위반'].filter(k=>k==='전체'||items.some(it=>it.type===k));
  if(!kinds.includes(BELL_TAB))BELL_TAB='전체';
  const list=items.filter(it=>BELL_TAB==='전체'||it.type===BELL_TAB);
  const at=B.at?new Date(B.at+':00Z').toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
  p.innerHTML=`<div class="bph"><b>알림</b><span>Wing 확인 ${esc(at)}</span></div>
    <div class="btabs">${kinds.map(k=>`<button data-k="${k}" class="${k===BELL_TAB?'on':''}">${k==='센터'?'고객센터':k} ${k==='전체'?items.length:items.filter(it=>it.type===k).length}</button>`).join('')}</div>
    ${list.length?list.map(it=>`<a class="bit" href="${esc(it.url||'https://wing.coupang.com')}" target="_blank" rel="noopener"><div class="bdot t${esc(it.type)}">${esc(it.type==='센터'?'센터':it.type)}</div><div style="min-width:0"><b>${esc(it.title)}${seen.has(bellKey(it))?'':'<span class="bnew"></span>'}</b>${it.text?`<p>${esc(it.text)}</p>`:''}</div>${it.at?`<small>${esc(it.at.slice(5).replace('T',' '))}</small>`:''}</a>`).join(''):'<div class="bempty">새 알림이 없어요</div>'}
    <div class="bpf">누르면 Wing 해당 화면이 열려요 · 답변·처리는 Wing에서 해 주세요</div>`;
  p.querySelector('.btabs').onclick=e=>{const k=e.target.dataset.k;if(k){BELL_TAB=k;drawBell();}};
}
function toggleBell(){
  const p=$('bellPanel');p.hidden=!p.hidden;drawBell();
  if(!p.hidden){try{localStorage.setItem('cd_bell_seen',JSON.stringify((bellData().items||[]).map(bellKey)))}catch(e){}
    setTimeout(()=>{const c=$('bellCnt');if(c)c.hidden=true},300);}

function autoRefresh(){
  if(window.__ar)return;window.__ar=setInterval(async()=>{
    if(document.hidden||!TOKEN||document.querySelector('.modal'))return;
    try{const fresh=await call('getData',TOKEN);if(JSON.stringify(fresh)===JSON.stringify(DATA))return;
      DATA=fresh;try{store.set('cd_data',JSON.stringify(fresh))}catch(e){}
      if(['costs','staff','warranty'].includes(TAB))return;
      const y=window.scrollY;buildNav();show(TAB,'replace');window.scrollTo(0,y);
    }catch(e){}
  },180000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOKEN&&Date.now()-(window.__arLast||0)>60000){window.__arLast=Date.now();
    call('getData',TOKEN).then(fresh=>{if(JSON.stringify(fresh)===JSON.stringify(DATA))return;DATA=fresh;try{store.set('cd_data',JSON.stringify(fresh))}catch(e){}
      if(!['costs','staff','warranty'].includes(TAB)){const y=window.scrollY;buildNav();show(TAB,'replace');window.scrollTo(0,y)}}).catch(()=>{})}});
}

    g.opts.forEach(([id,n])=>{const r=P[String(id)];const k=n||1;const x=by[k]=by[k]||{n:k,cnt:0,q:0,amt:0,cost:0,profit:0,opts:0,nocost:false};x.opts++;
      if(!r)return;any=true;x.cnt+=cnum(r['판매수량']);x.q+=cnum(r['판매수량'])*k;x.amt+=cnum(r['매출액']);
      if(isNaN(Number(r['원가'])))x.nocost=true;else{x.cost+=cnum(r['원가']);x.profit+=cnum(r['추정이익'])}});
    const rows=Object.values(by).sort((a,b)=>a.n-b.n);const T=rows.reduce((t,x)=>({cnt:t.cnt+x.cnt,q:t.q+x.q,amt:t.amt+x.amt,cost:t.cost+x.cost,profit:t.profit+x.profit}),{cnt:0,q:0,amt:0,cost:0,profit:0});

  cards.sort((a,b)=>b.T.amt-a.T.amt);

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lastDay(){const ds=(DATA.optDaily||[]).map(r=>String(r['날짜'])).sort();const u=String(DATA.updated||'').slice(0,10);let l=ds.length?ds[ds.length-1]:ymd(new Date());if(/^\d{4}-\d\d-\d\d$/.test(u)&&u>l)l=u;return l}
function firstDay(){const ds=(DATA.optDaily||[]).map(r=>String(r['날짜'])).sort();return ds.length?ds[0]:''}
function presetRange(k){const end=new Date(lastDay()+'T00:00:00');const d=new Date(end);
  if(k==='tm'){d.setDate(1);return {from:ymd(d),to:ymd(end),key:k}}
  if(k==='lm'){const e=new Date(end.getFullYear(),end.getMonth(),0),f=new Date(e.getFullYear(),e.getMonth(),1);return {from:ymd(f),to:ymd(e),key:k}}
  d.setDate(d.getDate()-Number(k)+1);return {from:ymd(d),to:ymd(end),key:k}}
function rangeBar(id){const r=RG[id]=RG[id]||presetRange('30');const P=[['30','30일'],['90','90일'],['180','180일'],['365','1년'],['tm','이번 달'],['lm','지난 달']];
  return `<div class="rbar" id="${id}"><span class="seg">${P.map(([k,l])=>`<button data-pk="${k}" class="${r.key===k?'on':''}">${l}</button>`).join('')}</span>
  <span class="rdates"><input type="date" class="input" data-rd="from" value="${r.from}" min="${firstDay()}" max="${lastDay()}"> ~ <input type="date" class="input" data-rd="to" value="${r.to}" min="${firstDay()}" max="${lastDay()}"></span></div>`}
function bindRange(id,redraw){const el=$(id);if(!el)return;
  el.onclick=e=>{const k=e.target.dataset.pk;if(!k)return;RG[id]=presetRange(k);el.outerHTML=rangeBar(id);bindRange(id,redraw);redraw()};
  el.onchange=e=>{const w=e.target.dataset.rd;if(!w)return;const r=Object.assign({},RG[id]);r[w]=e.target.value;if(r.from&&r.to&&r.from>r.to){const t=r.from;r.from=r.to;r.to=t}r.key='';RG[id]=r;el.outerHTML=rangeBar(id);bindRange(id,redraw);redraw()}}
function rangeLabel(r){const f=x=>x.replace(/^(\d{4})-(\d\d)-(\d\d)$/,(a,y,m,d)=>`${y}.${Number(m)}.${Number(d)}`);return `${f(r.from)} ~ ${f(r.to)}`}
function rangeRows(r){
  const base={};(DATA.products||[]).forEach(x=>base[String(x['옵션ID'])]=x);
  if(!(DATA.optDaily||[]).length)return (DATA.products||[]).slice();
  const nm={};(DATA.optNames||[]).forEach(x=>nm[String(x['옵션ID'])]=x);
  const agg={};(DATA.optDaily||[]).forEach(x=>{const d=String(x['날짜']);if(d<r.from||d>r.to)return;const id=String(x['옵션ID']);
    const o=agg[id]=agg[id]||{'옵션ID':id,'판매수량':0,'매출액':0,'원가':0,'추정이익':0,'반품수량':0,_nc:false};
    o['판매수량']+=cnum(x['판매수량']);o['매출액']+=cnum(x['매출액']);o['반품수량']+=cnum(x['반품수량']);
    if(x['원가']===''||isNaN(Number(x['원가'])))o._nc=true;else{o['원가']+=cnum(x['원가']);o['추정이익']+=cnum(x['추정이익'])}});
  const days=Math.max(1,Math.round((new Date(r.to)-new Date(r.from))/864e5)+1);
  return Object.values(agg).map(o=>{const b=base[o['옵션ID']]||{},n=nm[o['옵션ID']]||{};const st=b['현재고'];const q=o['판매수량'];

function groupRows(rows){

    const g=G[h[0]],n=h[1];const o=out[h[0]]=out[h[0]]||{'상품명':g.name,'옵션명':(g.batch||''),'옵션수':0,'판매수량':0,'나간수량':0,'매출액':0,'원가':0,'추정이익':0,'현재고':'','반품수량':0,'_nocost':false,'_grp':true};
    o['옵션수']++;o['판매수량']+=cnum(r['판매수량']);o['나간수량']+=cnum(r['판매수량'])*n;o['매출액']+=cnum(r['매출액']);o['반품수량']+=cnum(r['반품수량']);
    if(isNaN(Number(r['원가'])))o._nocost=true;else{o['원가']+=cnum(r['원가']);o['추정이익']+=cnum(r['추정이익'])}
    if(n===1&&r['현재고']!==''&&r['현재고']!=null)o['현재고']=cnum(o['현재고'])+cnum(r['현재고']);});
  return Object.values(out).map(o=>Object.assign(o,{'1개당 이익':o['나간수량']&&!o._nocost?o['추정이익']/o['나간수량']:'','원가':o._nocost?'원가 미입력':o['원가']}))
    .concat(left.map(r=>Object.assign({},r,{'나간수량':r['판매수량'],'옵션수':1,'옵션명':(r['옵션명']||'')+' · 원가 미연결'})));
}

function cnum(v){ if(v===null||v===undefined) return 0; v=Number(String(v).replace(/,/g,'')); return isFinite(v)?v:0; }
function costCalc(it, b, batchItems){
  b = b || {}; batchItems = batchItems || [it];
  const r = {warn:[]};
  const qty = cnum(it.qty);
  const fx = cnum(it.fx) || cnum(b.fx);
  const agent = cnum(it.agent);   // 비워두면 0% (차수 기본값은 새 상품 만들 때만 채워 넣음)
  if(!fx) r.warn.push('환율');
  // 1) 상품가 (위안 → 원)
  r.goodsCny = cnum(it.cny) * (qty || 1) + cnum(it.ship);
  r.goods = qty ? (r.goodsCny * fx * (1 + agent/100)) / qty : cnum(it.cny) * fx * (1 + agent/100);
  // 2) 차수 공동비용 배분
  const total = (b.costs||[]).reduce((s,c)=>s+cnum(c.amount),0);
  r.batchTotal = total;
  if(!b.name) r.shared = 0;
  else if(b.alloc==='cbm'){
    const sum = batchItems.reduce((s,x)=>s+cnum(x.cbm)*cnum(x.qty),0);
    r.shared = (sum && qty) ? total * (cnum(it.cbm)*qty/sum) / qty : 0;
    if(total && !cnum(it.cbm)) r.warn.push('부피(CBM)');
  } else {
    const den = cnum(b.allocQty) || batchItems.reduce((s,x)=>s+cnum(x.qty),0);
    r.shared = den ? total/den : 0;
  }
  if(b.name && !total) r.warn.push('차수 공동비용');
  // 3) 부자재
  r.material = cnum(it.sticker) + cnum(it.pack);
  // 3-1) 관세 (상품값 × 관세율, 부가세는 환급되므로 제외)
  r.duty = cnum(it.cny) * fx * cnum(it.duty) / 100;
  r.unitBase = r.goods + r.shared + r.material + r.duty;
  // 4) 파손 반영 (실제 팔 수 있는 수량으로 나눔)
  const real = qty - cnum(it.dmg);
  r.unit = (qty && real > 0) ? r.unitBase * qty / real : r.unitBase;
  r.dmgCost = r.unit - r.unitBase;
  // 5) 쿠팡 입고비 (밀크런 / 파레트)
  // 차수 입고: 상품별 입고 방식(파레트/밀크런/나눠서) + 실은 수량
  const inMode=x=>{const v=x.inbound;if(v==='batch'||v==='bpallet'||v==='bmilk'||v==='bsplit')return b.inMode==='pallet'?'bpallet':'bmilk';return v};
  const inQ=x=>{const has=v=>v!==''&&v!=null;
    if(b.inMode==='pallet'&&has(x.palBox)&&['batch','bpallet','bmilk','bsplit'].includes(x.inbound))return {p:cnum(x.palBox)*cnum(x.perBox),m:0};   // 파레트 박스 수 × 박스당 입수
    const m=inMode(x),base=Math.max(0,cnum(x.qty)-cnum(x.dmg));
    return {p:m==='bpallet'?(has(x.inPal)?cnum(x.inPal):base):m==='bsplit'?cnum(x.inPal):0, m:m==='bmilk'?(has(x.inMilk)?cnum(x.inMilk):base):m==='bsplit'?cnum(x.inMilk):0}};
  const im=inMode(it);
  if(im==='bpallet'||im==='bmilk'||im==='bsplit'){
    const q=inQ(it), ptot=cnum(b.pallets)*cnum(b.palletFee), bf=cnum(b.boxFee)||4000;
    const its=batchItems.filter(x=>['bpallet','bmilk','bsplit','batch'].includes(x.inbound));
    const palSum=b.alloc==='cbm'?its.reduce((s,x)=>s+inQ(x).p*cnum(x.cbm),0):its.reduce((s,x)=>s+inQ(x).p,0);
    r.palUnit = palSum ? ptot*(b.alloc==='cbm'?cnum(it.cbm):1)/palSum : 0;   // 파레트로 보낸 1개당
    r.milkUnit = cnum(it.perBox) ? bf/cnum(it.perBox) : 0;                    // 밀크런으로 보낸 1개당
    r.palQ=q.p; r.milkQ=q.m; r.palSum=palSum; r.palTotal=ptot;
    r.inbound = (q.p+q.m) ? (q.p*r.palUnit + q.m*r.milkUnit)/(q.p+q.m) : 0;
    r.inLabel = im==='bpallet'?'차수 파레트':im==='bmilk'?'밀크런':'파레트+밀크런';
    if(q.p&&!ptot) r.warn.push('차수 파레트 요금');
    if(q.m&&!cnum(it.perBox)) r.warn.push('박스당 입수');
    if(im==='bsplit'&&!(q.p+q.m)) r.warn.push('파레트·밀크런 수량');
  } else if(it.inbound==='pallet'){
    const per = cnum(it.perPallet) || cnum(it.palletBoxes) * cnum(it.perBox);
    r.perPallet = per;
    r.inbound = per ? cnum(it.palletFee)/per : 0;
    if(!cnum(it.palletFee)||!per) r.warn.push('파레트 요금/수량');
  } else if(it.inbound==='direct'){
    r.inbound = cnum(it.inboundCost);
  } else if(it.inbound==='none'){
    r.inbound = 0;
  } else {
    r.inbound = cnum(it.perBox) ? cnum(it.boxFee)/cnum(it.perBox) : 0;
    if(!cnum(it.perBox)) r.warn.push('박스당 입수');
  }
  // 비교용: 밀크런·파레트 각각 개당 입고비
  r.cmpMilk = cnum(it.perBox) ? (cnum(it.boxFee)||4000)/cnum(it.perBox) : null;
  const pp = cnum(it.perPallet) || cnum(it.palletBoxes) * cnum(it.perBox);
  r.cmpPallet = (pp && cnum(it.palletFee)) ? cnum(it.palletFee)/pp : null;
  if(r.palUnit) r.cmpPallet = r.palUnit;
  if(r.milkUnit) r.cmpMilk = r.milkUnit;
  const set = cnum(it.set) || 1;
  r.set = set;
  r.landed = (r.unit + r.inbound) * set;           // 판매 1건당 원가 (= 원가 시트에 들어가는 값)
  // 6) 쿠팡 판매 비용
  const price = cnum(it.price), f = cnum(it.fee)/100;
  r.price = price;
  r.feeAmt = price * f;
  r.logi = cnum(it.shipFee) + cnum(it.whFee);
  r.etc = cnum(it.etc);
  r.margin1 = price - r.feeAmt - r.landed;
  r.margin = r.margin1 - r.logi - r.etc;
  r.rate = price ? r.margin/price : 0;
  // 부가세(대략): 매출세액 − 수수료·물류비에 포함된 매입세액
  r.vat = price/11 - (r.feeAmt + r.logi)/11;
  r.marginVat = r.margin - r.vat;
  r.rateVat = price ? r.marginVat/price : 0;
  const fixed = r.landed + r.logi + r.etc;
  r.breakEven = (1-f) > 0 ? fixed/(1-f) : 0;
  const t = cnum(it.target)/100;
  r.targetPrice = (1-f-t) > 0 ? fixed/(1-f-t) : 0;
  r.zeroRoas = r.margin > 0 ? price / r.margin * 100 : 0;
  // 7) 광고 시뮬레이션 (하루 기준 → 30일)
  const spend = cnum(it.adSpend), roas = cnum(it.adRoas)/100;
  r.adSales = spend * roas;
  r.adUnits = price ? r.adSales/price : 0;
  r.adProfit = r.adUnits * r.margin - spend;
  r.organic = cnum(it.organic);
  r.month = (r.adProfit + r.organic * r.margin) * 30;
  if(!price) r.warn.push('희망판매가');
  return r;
}

function fmtNum(v){if(v===''||v==null)return '';const t=String(v).replace(/,/g,'');if(!/^-?\d*\.?\d*$/.test(t))return String(v);
  const [a,b]=t.split('.');const ia=a.replace(/\B(?=(\d{3})+(?!\d))/g,',');return b!==undefined?ia+'.'+b:ia;}
function numv(v){v=String(v==null?'':v).replace(/,/g,'').trim();return v===''?'':(isFinite(Number(v))?Number(v):'');}
if(!window.__numFmt){window.__numFmt=1;document.addEventListener('input',e=>{const el=e.target;if(!el||!el.matches||!el.matches('input[data-num]'))return;
  const raw=el.value,pos=el.selectionStart||0;const keep=raw.slice(0,pos).replace(/[^\d.\-]/g,'').length;
  const clean=raw.replace(/[^\d.\-]/g,'');const f=fmtNum(clean);if(f===raw)return;el.value=f;
  let i=0,c=0;while(i<f.length&&c<keep){if(/[\d.\-]/.test(f[i]))c++;i++;}try{el.setSelectionRange(i,i)}catch(_){}},true);}

const wonx=n=>(n==null||n===''||!isFinite(n))?'-':Math.round(n).toLocaleString('ko-KR');
const pct1=n=>(!isFinite(n)?'-':(n*100).toFixed(1)+'%');
const sgn=n=>n<0?'down':(n>0?'up':'');

function bookStats(){const m={};(BOOK.stats||[]).forEach(r=>m[String(r['옵션ID'])]=r);return m;}
function guessN(t){const m=String(t||'').match(/(\d+)\s*개/g)||[];for(const x of m){const n=parseInt(x);if(n>=1&&n<=20)return n}return 1}
function optN(it,id){return cnum((it.optSet||{})[id])||1}
function itemStats(it,SM){
  const o={ad30:0,adsales30:0,q30:0,a30:0,q1:0,a1:0,q90:0,ret:0,retW:0,fee:0,feeW:0,stock:0,hasStock:false,img:''};
  (it.opts||[]).forEach(id=>{const s=SM[id];if(!s)return;const n=optN(it,id);
    o.q30+=cnum(s['판매수량30'])*n;o.a30+=cnum(s['매출액30']);if(n===1){o.q1+=cnum(s['판매수량30']);o.a1+=cnum(s['매출액30'])}const q90=cnum(s['판매수량90']);o.q90+=q90;
    if(s['반품률90']!==''){o.ret+=cnum(s['반품률90'])*(q90||1);o.retW+=(q90||1)}
    if(s['실제수수료율']!==''){o.fee+=cnum(s['실제수수료율'])*(q90||1);o.feeW+=(q90||1)}
    if(s['현재고']!==''){o.stock+=cnum(s['현재고']);o.hasStock=true}
    if(!o.img&&s['이미지'])o.img=s['이미지'];
    o.ad30+=cnum(s['광고비30']);o.adsales30+=cnum(s['광고매출30']);});
  o.avg=o.q1?o.a1/o.q1:(o.q30?o.a30/o.q30:0);o.retRate=o.retW?o.ret/o.retW:null;o.feeRate=o.feeW?o.fee/o.feeW:null;
  return o;
}
function batchOf(name){return (BOOK.batches||[]).find(b=>b.name===name)||null}
function batchItems(name,override){return BOOK.items.filter(x=>x.batch===name).map(x=>override&&x.id===override.id?override:x).concat(override&&override.batch===name&&!BOOK.items.some(x=>x.id===override.id)?[override]:[])}
function calcItem(it){return costCalc(it,batchOf(it.batch),batchItems(it.batch,it))}
function thumb(src,name,size){size=size||48;
  const ch=esc(String(name||'?').replace(/^[\[\(].*?[\]\)]\s*/,'').replace(/^픽샵\s*/,'').slice(0,1));
  return `<div class="thumb ph" style="width:${size}px;height:${size}px">${ch}${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:''}</div>`}

  }

}
function costHash(v){
  if(v.view==='item')return 'costs/item/'+encodeURIComponent(v.id||'new');

  const SM=bookStats();

  m.innerHTML=`
  <div class="dhead">

    <div class="dtw"><div class="dtitle" id="dTitle">${esc(CEDIT.name||'새 상품')}</div></div>

  </div>
  <div class="dgrid">
   <div class="dleft">
    <section class="card dsec"><h3>상품 정보</h3>

        <div class="pimg" id="pImg"></div>
        <div style="flex:1;min-width:0">
          <label class="f"><span>상품명</span><input data-k="name" data-t="s" value="${esc(CEDIT.name)}" placeholder="예) 픽샵 데스크 매트 1200×600 블랙"></label>
          <label class="f"><span>차수</span><select data-k="batch" data-t="s"><option value="">차수 없음</option>${batches.map(b=>`<option ${CEDIT.batch===b?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
        </div>

      <label class="f"><span>소싱 링크</span><div class="iw"><input data-k="link" data-t="s" style="text-align:left" value="${esc(CEDIT.link)}" placeholder="1688 / 타오바오 주소"><a class="btn-ghost" id="lnk" target="_blank" rel="noopener">열기</a></div></label>
      <div class="f"><span>사진 <small class="muted">(비워두면 연결된 쿠팡 옵션의 대표 이미지 · 사진 파일을 올리거나 이미지 주소를 붙여넣기)</small></span>

        <label class="btn-ghost" style="cursor:pointer;white-space:nowrap">사진 올리기<input type="file" id="imgFile" accept="image/*" style="display:none"></label>
        <button class="btn-ghost" id="imgClr" style="white-space:nowrap">지우기</button></div></div>
      <label class="f"><span>메모</span><textarea data-k="memo" data-t="s" rows="2">${esc(CEDIT.memo)}</textarea></label>
      <div class="f"><span>쿠팡 옵션 연결 <small class="muted">— 연결된 옵션의 판매·이익에 이 원가가 쓰여요 · 번들 옵션은 "N개 묶음"으로 고르면 원가 × N으로 계산</small></span>

    <section class="card dsec"><h3>사입비용 <small class="muted">중국 매입 → 국내 입고</small></h3>

        ${F('fx','환율','원/위안')}${F('agent','구매대행 수수료','%','비우면 0% · 직접 수입이면 비워두기')}${F('ship','현지 운송비','위안','중국 내륙, 주문 전체 금액')}${F('duty','관세','%','상품값 기준 (보통 8) · 예전처럼 운송비에 넣었으면 비우기')}

      </div>

    <section class="card dsec"><h3>쿠팡 입고 <small class="muted">파레트·박스 요금은 차수 관리에서</small></h3>
      <div class="seg wide" id="inSeg">
        ${inSegHtml()}

    <section class="card dsec"><h3>쿠팡 판매비용 <small class="muted">로켓그로스</small></h3>
      <div class="fg">
        ${F('price','희망판매가','원','실제 판매가는 바뀌어도 목표 가격으로 계산',`id="fPrice"`)}${F('fee','판매수수료(VAT 포함)','%','카테고리 요율 × 1.1')}${F('etc','기타비용(건당)','원','보관비·반품 등')}
        ${F('shipFee','배송비','원','로켓그로스')}${F('whFee','입출고비','원','로켓그로스')}
      </div>
      <div id="sellHelp" class="hrow"></div>
      <details class="rgt"><summary>로켓그로스 사이즈 기준표에서 고르기</summary><div id="rgTable"></div></details>
    </section>

    <section class="card dsec"><h3>광고 시뮬레이션</h3>
      <div class="fg">${F('adSpend','하루 광고비','원')}${F('adRoas','ROAS','%','광고매출 ÷ 광고비')}${F('organic','광고 외 하루 판매','개')}</div>

  drawItemDynamic();
  m.querySelectorAll('[data-k]').forEach(el=>{
    const ev=el.tagName==='SELECT'?'onchange':'oninput';
    el[ev]=()=>{const k=el.dataset.k;CEDIT[k]=el.dataset.t==='s'?el.value:(numv(el.value));CDIRTY=true;
      if(k==='name')$('dTitle').textContent=el.value||'새 상품';
      if(k==='batch')drawInbound();
      if(k==='batch'&&!src){const b=batchOf(el.value);if(b&&b.fx&&!CEDIT.fx){CEDIT.fx=b.fx;const i=m.querySelector('[data-k=fx]');if(i)i.value=b.fx}}
      drawItemDynamic(k);};
  });
  $('inSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;CEDIT.inbound=b.dataset.v;CDIRTY=true;
    $('inSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawInbound();drawItemDynamic();};
  drawInbound();
  // 사진: 파일 올리기(작게 줄여서 저장) · 주소 붙여넣기 · 화면에 붙여넣기(Ctrl+V)
  const setImg=v=>{CEDIT.img=v;CDIRTY=true;$('imgUrl').value=v.startsWith('data:')?'':v;$('imgUrl').placeholder=v.startsWith('data:')?'올린 사진 사용 중':'https://... (이미지 주소)';drawItemDynamic();};
  const readImg=f=>{if(!f||!/^image\//.test(f.type)){toast('사진 파일을 골라 주세요');return}
    const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const S=220,k=Math.min(1,S/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      setImg(c.toDataURL('image/jpeg',0.82));toast('사진을 넣었어요. 저장을 눌러 주세요');};im.onerror=()=>toast('사진을 읽지 못했어요');im.src=fr.result;};fr.readAsDataURL(f);};
  $('imgFile').onchange=e=>readImg(e.target.files[0]);
  $('imgUrl').oninput=e=>{CEDIT.img=e.target.value.trim();CDIRTY=true;drawItemDynamic();};
  $('imgClr').onclick=e=>{e.preventDefault();setImg('');};
  $('pImg').style.cursor='pointer';$('pImg').title='눌러서 사진 올리기';$('pImg').onclick=()=>$('imgFile').click();
  m.onpaste=e=>{const it=[...(e.clipboardData||{}).items||[]].find(x=>x.type&&x.type.startsWith('image/'));if(it){e.preventDefault();readImg(it.getAsFile())}};
  $('dBack').onclick=()=>costGo({view:'list',f:CV.f});
  $('dSave').onclick=saveItem;
  if(src){
    $('dDel').onclick=async()=>{if(!confirm(`'${src.name}' 을(를) 삭제할까요?`))return;
      try{await call('deleteCostItem',TOKEN,src.id);BOOK.items=BOOK.items.filter(x=>x.id!==src.id);CDIRTY=false;toast('삭제했어요');costGo({view:'list',f:CV.f})}catch(e){toast(e.message)}};
    $('dCopy').onclick=()=>{const c=JSON.parse(JSON.stringify(CEDIT));if(!c.img){const im=itemStats(CEDIT,bookStats()).img;if(im)c.img=im;}c.id=null;c.opts=[];c.name=c.name+' (복사)';
      if(CDIRTY&&!confirm('저장하지 않은 내용이 있어요. 그래도 복사할까요?'))return;CDIRTY=false;
      CV={view:'item',id:null,draft:c,f:CV.f};navHash(costHash(CV));renderCosts(document.getElementById('main'),'');toast('복사본이에요. 차수를 바꾸고 저장하세요');};
  }
  // 옵션 검색
  const allOpts=(BOOK.options||[]);
  const owner={};BOOK.items.forEach(x=>{if(x.id!==CEDIT.id)(x.opts||[]).forEach(o=>owner[o]=x.name)});
  const SMx=SM;
  $('optQ').oninput=()=>{const q=$('optQ').value.trim().toLowerCase();
    if(!q){$('optRes').innerHTML='';return}
    const res=allOpts.filter(o=>!(CEDIT.opts||[]).includes(o.id)&&((o.product+' '+o.option+' '+o.id).toLowerCase().includes(q))).slice(0,30);
    $('optRes').innerHTML=res.map(o=>`<div class="optr" data-id="${esc(o.id)}"><div style="flex:1;min-width:0"><div class="cname">${esc(o.product)} ${esc(o.option)}</div>
      <div class="muted">${esc(o.id)} · 30일 ${wonx((SMx[o.id]||{})['판매수량30']||0)}개${owner[o.id]?` · <span style="color:var(--warn)">지금 '${esc(owner[o.id])}'에 연결됨 → 옮겨짐</span>`:''}</div></div><button class="btn sec">추가</button></div>`).join('')||'<div class="muted" style="padding:8px">검색 결과가 없어요</div>';};
  $('optRes').onclick=e=>{const r=e.target.closest('.optr');if(!r)return;CEDIT.opts=(CEDIT.opts||[]).concat(r.dataset.id);{const n=guessN(r.textContent);if(n>1){CEDIT.optSet=Object.assign({},CEDIT.optSet);CEDIT.optSet[r.dataset.id]=n}}CDIRTY=true;$('optQ').value='';$('optRes').innerHTML='';drawItemDynamic();};
  $('optChips').onclick=e=>{const x=e.target.closest('[data-rm]');if(!x)return;CEDIT.opts=CEDIT.opts.filter(o=>o!==x.dataset.rm);if(CEDIT.optSet)delete CEDIT.optSet[x.dataset.rm];CDIRTY=true;drawItemDynamic();};
  $('optChips').onchange=e=>{const x=e.target.closest('[data-n]');if(!x)return;CEDIT.optSet=Object.assign({},CEDIT.optSet);const n=cnum(x.value)||1;if(n>1)CEDIT.optSet[x.dataset.n]=n;else delete CEDIT.optSet[x.dataset.n];CDIRTY=true;drawItemDynamic();};
  $('sellHelp').onclick=e=>{const b=e.target.closest('[data-fill]');if(!b)return;const[k,v]=b.dataset.fill.split('=');setField(k,Number(v));};
  $('rgTable').onclick=e=>{const c=e.target.closest('[data-rg]');if(!c)return;const[s,w]=c.dataset.rg.split(',');if(s!=='null')setField('shipFee',Number(s));if(w!=='null')setField('whFee',Number(w));toast('배송비·입출고비를 채웠어요');};
}
function setField(k,v){CEDIT[k]=v;CDIRTY=true;const i=document.querySelector(`[data-k="${k}"]`);if(i)i.value=fmtNum(v);drawItemDynamic(k);}
function inSegHtml(){const bb=batchOf(CEDIT.batch)||{};const cur=CEDIT.inbound||'milkrun';
  const opts=[['batch','차수 따름 ('+(bb.inMode==='pallet'?'파레트':'밀크런')+')']];
  if(cur==='milkrun')opts.push(['milkrun','밀크런(예전 방식)']);if(cur==='pallet')opts.push(['pallet','파레트(예전 방식)']);
  opts.push(['direct','직접 입력'],['none','없음']);
  return opts.map(([k,l])=>`<button data-v="${k}" class="${cur===k||(['bpallet','bmilk','bsplit'].includes(cur)&&k==='batch')?'on':''}">${l}</button>`).join('');}
function drawInbound(){
  const t=CEDIT.inbound||'milkrun';
  const bb=batchOf(CEDIT.batch)||{};const bf=wonx(cnum(bb.boxFee)||4000);
  const ptxt=`파레트 ${wonx(cnum(bb.pallets))}개 × ${wonx(cnum(bb.palletFee))}원 = <b>${wonx(cnum(bb.pallets)*cnum(bb.palletFee))}원</b>`;
  const m2=['batch','bpallet','bmilk','bsplit'].includes(t)?(bb.inMode==='pallet'?'bpallet':'bmilk'):t;
  const r0=calcItem(CEDIT);
  $('inFields').innerHTML=m2==='bpallet'
      ?F('perBox','박스당 입수','개')+F('palBox','파레트에 실은 박스 수','박스',`= 낱개 ${wonx(r0.palQ)}개`)+`<div class="muted" style="grid-column:span 2;align-self:center;line-height:1.6">차수 파레트 ${ptxt}<br>÷ 파레트에 실린 낱개 ${wonx(r0.palSum)}개 = 개당 <b>${wonx(r0.palUnit)}원</b></div>`
    :m2==='bmilk'
      ?F('perBox','박스당 입수','개','한 박스에 들어가는 수량')+`<div class="muted" style="grid-column:span 2;align-self:center">이 상품은 <b>밀크런</b> · 박스당 ${bf}원 ÷ 박스당 입수 (요금은 차수 관리에서)</div>`
    :m2==='bsplit'
      ?F('perBox','박스당 입수','개')+F('palBox','파레트 박스 수','박스',`= ${wonx(r0.palQ)}개`)+F('milkBox','밀크런 박스 수','박스',`= ${wonx(r0.milkQ)}개`)+`<div class="muted" style="grid-column:1/-1">파레트 개당 ${wonx(r0.palUnit)}원 × ${wonx(r0.palQ)}개 + 밀크런 개당 ${wonx(r0.milkUnit)}원 × ${wonx(r0.milkQ)}개 → 평균 <b>${wonx(r0.inbound)}원</b></div>`
    :t==='milkrun'?F('boxFee','박스당 요금','원','기본 4,000원')+F('perBox','박스당 입수','개','한 박스에 들어가는 수량')
    :t==='pallet'?F('palletFee','파레트당 요금','원','받은 견적 금액')+F('palletBoxes','파레트당 박스 수','박스')+F('perBox','박스당 입수','개')+F('perPallet','파레트당 수량(직접)','개','비우면 박스 수 × 입수')
    :t==='direct'?F('inboundCost','개당 입고비','원'):'<div class="muted">입고비를 따로 계산하지 않아요.</div>';
  $('inSeg').innerHTML=inSegHtml();
  $('inFields').querySelectorAll('[data-k]').forEach(el=>{el.oninput=()=>{CEDIT[el.dataset.k]=numv(el.value);CDIRTY=true;drawItemDynamic(el.dataset.k)};el.onchange=()=>drawInbound();});
}
function drawItemDynamic(changed){
  const r=calcItem(CEDIT), SM=bookStats(), s=itemStats(CEDIT,SM), b=batchOf(CEDIT.batch);
  // 이미지
  const img=CEDIT.img||s.img;
  $('pImg').innerHTML=thumb(img,CEDIT.name,96);
  const ln=$('lnk');if(ln){ln.href=CEDIT.link||'#';ln.style.visibility=CEDIT.link?'visible':'hidden'}
  // 옵션 칩 + 실제 실적
  const opts=BOOK.options||[];const name=id=>{const o=opts.find(x=>x.id===id);return o?(o.product+' '+o.option).trim():id};
  $('optChips').innerHTML=(CEDIT.opts||[]).map(id=>{const n=optN(CEDIT,id);return `<span class="chip${n>1?' bund':''}">${esc(name(id))} <small>${esc(id)}</small><select data-n="${esc(id)}" title="이 옵션 1건에 몇 개가 나가나요">${[1,2,3,4,5,6,8,10].concat(n>10||![1,2,3,4,5,6,8,10].includes(n)?[n]:[]).map(k=>`<option value="${k}"${k===n?' selected':''}>${k===1?'1개':k+'개 묶음'}</option>`).join('')}</select><button data-rm="${esc(id)}" title="연결 해제">×</button></span>`}).join('')||'<span class="muted">연결된 옵션이 없어요</span>';
  $('actual').innerHTML=(CEDIT.opts||[]).length?`<div class="actual">
    <div><small>최근 30일 판매</small><b>${wonx(s.q30)}개</b></div>
    <div><small>30일 평균 판매가</small><b>${s.avg?wonx(s.avg)+'원':'-'}</b></div>
    <div><small>실제 수수료율(90일)</small><b>${s.feeRate!=null?pct1(s.feeRate):'-'}</b></div>
    <div><small>반품률(90일)</small><b class="${s.retRate>0.1?'down':''}">${s.retRate!=null?pct1(s.retRate):'-'}</b></div>
    <div><small>현재 재고</small><b>${s.hasStock?wonx(s.stock)+'개':'-'}</b></div></div>`:'';
  // 판매비용 도우미
  const help=[];
  if(s.avg&&Math.round(s.avg)!==cnum(CEDIT.price))help.push(`<button class="btn-ghost" data-fill="price=${Math.round(s.avg)}">실제 평균 판매가 ${wonx(s.avg)}원 넣기</button>`);
  if(s.feeRate!=null&&Math.abs(s.feeRate*100-cnum(CEDIT.fee))>0.05)help.push(`<button class="btn-ghost" data-fill="fee=${(s.feeRate*100).toFixed(2)}">실제 수수료율 ${pct1(s.feeRate)} 넣기</button>`);
  $('sellHelp').innerHTML=help.join('');
  // 기준표
  const p=cnum(CEDIT.price);const bi=RG_BANDS.findIndex(x=>p>=x[0]&&p<x[1]);
  if(!changed||changed==='price'){
    $('rgTable').innerHTML=bi<0?'<div class="muted">희망판매가를 먼저 입력하세요</div>':`<div class="muted" style="margin:6px 0">희망판매가 ${wonx(p)}원 구간 · 위: 배송비 / 아래: 입출고비 (스프레드시트 기준표 값, 눌러서 채우기)</div>
    <div class="rggrid">${RG_SIZES.map((z,i)=>{const v=RG_BANDS[bi][2][i];return `<button class="rgc" data-rg="${v[0]},${v[1]}"><b>${z}</b><small>${RG_SIZE_DESC[i]}</small><span>${wonx(v[0])}</span><span>${v[1]==null?'—':wonx(v[1])}</span></button>`}).join('')}</div>`;
  }
  // 입고 비교

async function saveItem(){
  if(!String(CEDIT.name||'').trim()){toast('상품명을 입력해 주세요');return}
  const btn=$('dSave');btn.disabled=true;btn.textContent='저장 중…';
  try{
    const res=await call('saveCostItems',TOKEN,[CEDIT]);
    BOOK.items=res.items;CDIRTY=false;
    const f=Object.assign({q:'',b:'',sort:'batch',active:true},CV.f||{});
    if(!(CEDIT.opts||[]).length){f.active=false;f.b=CEDIT.batch||'';f.q='';   // 옵션 연결 전인 상품도 목록에 보이게
      toast('저장했어요. 쿠팡 옵션을 연결해야 매출·이익에 반영돼요');}
    else toast('저장했어요. 대시보드 이익은 다음 자동 업데이트 때 반영돼요');

}

/* ═════════ 보증·교환 (SSD 등 보증 상품) ═════════ */
let WD=null;
const W_STATUS=['접수','회수 대기','회수 완료','교환 발송','완료','거절'];
const W_STCLS={'접수':'warn','회수 대기':'warn','회수 완료':'warn','교환 발송':'','완료':'ok','거절':'bad'};
const wn=v=>{v=Number(String(v==null?'':v).replace(/,/g,''));return isFinite(v)?v:0};
const wnum=n=>Math.round(n||0).toLocaleString('ko-KR');
function wToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wAddYears(s,y){const d=new Date(s.slice(0,10)+'T00:00:00');d.setFullYear(d.getFullYear()+Number(y||0));d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wDays(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function wItems(p){return WD.book.filter(it=>(p.items||[]).includes(it.name))}
function wOpts(p){const s=new Set();wItems(p).forEach(it=>(it.opts||[]).forEach(o=>s.add(String(o))));return s}
function wProdOfOpt(opt){return WD.products.find(p=>wOpts(p).has(String(opt)))||null}
function wBatchDate(n){const b=WD.batches.find(b=>b.name===n);if(b&&b.date)return b.date;const s=WD.serials.find(s=>s.batch===n&&s.date);return s?s.date:''}
function wSerials(p){return WD.serials.filter(s=>s.pid===p.id)}
function wSpare(p){const used=WD.exchanges.filter(x=>x.pid===p.id&&String(x.sent||'').trim()&&x.status!=='거절').length;return {inQ:wn(p.spareIn),used,now:wn(p.spareIn)-used}}

/* 선입선출: 먼저 들어온 차수부터 팔렸다고 보고 차수별 판매 기간·남은 수량·주문별 차수 추정 */
function wFifo(p){
  const map={};wItems(p).forEach(it=>{const k=it.batch||'(차수 없음)';map[k]=(map[k]||0)+Math.max(0,wn(it.qty)-wn(it.dmg))});
  const bs=Object.keys(map).map(n=>{const o=(p.batchIn||{})[n];return {name:n,date:wBatchDate(n),cost:map[n],inQty:o!==undefined&&o!==''?wn(o):map[n],sold:0,first:'',last:''}});
  bs.sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:a.name<b.name?-1:1);
  let over=0;const ob={};
  const take=(q,date,oid)=>{const used=[];while(q>0){const b=bs.find(b=>b.sold<b.inQty);if(!b){over+=q;break}
    const t=Math.min(q,b.inQty-b.sold);b.sold+=t;q-=t;if(date){if(!b.first)b.first=date;b.last=date}else if(!b.first)b.first='데이터 이전';used.push(b.name)}
    if(oid)ob[oid]=(ob[oid]||[]).concat(used.filter(x=>!(ob[oid]||[]).includes(x)))};
  take(wn(p.preSold),'',null);
  const opts=wOpts(p);let sold=wn(p.preSold);
  WD.sales.forEach(s=>{if(!opts.has(String(s[2])))return;take(s[3],String(s[0]).slice(0,10),String(s[1]));sold+=s[3]});
  bs.forEach(b=>b.remain=b.inQty-b.sold);
  return {bs,ob,over,sold,inTotal:bs.reduce((a,b)=>a+b.inQty,0)};
}
function wFindSerial(q){
  q=String(q||'').trim().toUpperCase();if(q.length<4)return [];
  const out=[];WD.serials.forEach(s=>(s.list||[]).forEach(r=>{const v=String(r[0]).toUpperCase();if(v===q||(q.length>=6&&v.includes(q)))out.push({p:WD.products.find(p=>p.id===s.pid),batch:s.batch,serial:r[0],mfg:r[1]||'',exact:v===q})}));
  return out.sort((a,b)=>b.exact-a.exact).slice(0,10);
}

async function wLookup(q){
  const box=$('wres');if(!q){box.innerHTML='';return}
  box.innerHTML='<div class="muted">찾는 중…</div>';
  const sers=wFindSerial(q);

  const today=wToday();const parts=[];
  orders.forEach(o=>{
    const p=wProdOfOpt(o.opt);const date=String(o.time||o.date).slice(0,10);
    let verdict='<span class="pill">보증 상품 아님</span>',detail='';
    if(p){const end=wAddYears(date,p.years);const left=wDays(today,end);const f=wFifo(p);const bat=(f.ob[o.orderId]||[]);
      verdict=left>=0?`<span class="pill ok" style="font-size:15px;padding:4px 12px">보증 가능 · ${wnum(left)}일 남음</span>`:`<span class="pill bad" style="font-size:15px;padding:4px 12px">보증 만료 (${esc(end)})</span>`;
      detail=`<div class="r2"><span>보증 기간</span><b>${esc(date)} ~ ${esc(end)} (${esc(p.years)}년)</b></div>
${p.tbw?`<div class="r2"><span>TBW 기준</span><b>${esc(p.tbw)} (고객 SMART 정보로 확인)</b></div>`:''}`;}
    parts.push(`<div class="wres">${verdict}<div style="font-weight:700;margin-top:8px">${esc(o.name)} ${esc(o.option||'')}</div>
      <div class="r2"><span>주문번호</span><b>${esc(o.orderId)}</b></div><div class="r2"><span>구매일(결제)</span><b>${esc(o.time||o.date)}</b></div><div class="r2"><span>수량</span><b>${wnum(o.qty)}개</b></div>${detail}
      <button class="btn-ghost" style="margin-top:8px" data-exnew='${esc(JSON.stringify({orderId:o.orderId,pid:p?p.id:'',buy:date}))}'>이 주문으로 교환 접수</button></div>`)});
  sers.forEach(s=>{
    const p=s.p;let win='';
    if(p)win=`<div class="r2"><span>보증 기간</span><b>고객의 쿠팡 구매일부터 ${esc(p.years)}년 (주문번호로 조회해서 확인)</b></div>`;
    parts.push(`<div class="wres"><span class="pill ok" style="font-size:15px;padding:4px 12px">우리 입고 시리얼${s.exact?'':' (일부 일치)'}</span>
      <div style="font-weight:700;margin-top:8px">${esc(s.serial)}</div><div class="r2"><span>상품</span><b>${esc(p?p.name:'-')}</b></div>
      <div class="r2"><span>입고 배치</span><b>${esc(s.batch)} (${esc(wBatchDate(s.batch)||'-')})</b></div>${s.mfg?`<div class="r2"><span>제조일</span><b>${esc(s.mfg)}</b></div>`:''}${win}</div>`)});
  if(!orders.length&&!sers.length){

function wStock(p){const o=wOpts(p);let st=0,s30=0,has=false;((typeof DATA!=='undefined'&&DATA&&DATA.inventory)||[]).forEach(r=>{if(o.has(String(r['옵션ID']))){has=true;st+=wn(r['주문가능재고']);s30+=wn(r['최근30일판매'])}});return {st,s30,has}}

function wLoadXlsx(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('엑셀 읽기 도구를 불러오지 못했어요'));document.head.appendChild(sc)})}
function wTemplate(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const L=[['입고일','입고배치(차수)','상품명','시리얼넘버','제품넘버','보증기간'],['예시) 2026-11-02','SSD 1차','US75 1TB','="00000000000000"','SP01KGBP44US7505','보증 5년']];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+L.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='시리얼_입력양식.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)}
function wDateStr(v){if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const m=String(v||'').trim().match(/(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/);return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):String(v||'').trim()}
function wParseRows(aoa){
  const norm=x=>String(x==null?'':x).replace(/\s|\?|\(|\)/g,'');
  let hi=aoa.findIndex(r=>r&&r.some(c=>/시리얼/.test(norm(c))));if(hi<0)return {err:'"시리얼넘버" 제목이 있는 줄을 찾지 못했어요. 양식을 받아 그대로 써 주세요.'};
  const H=aoa[hi].map(norm),col=re=>H.findIndex(h=>re.test(h));
  const c={date:col(/입고일/),batch:col(/차수|배치/),name:col(/상품명|상품/),serial:col(/시리얼/),model:col(/제품넘버|모델|제품번호/),years:col(/보증/)};
  if(c.serial<0||c.name<0||c.batch<0)return {err:'상품명·입고배치(차수)·시리얼넘버 칸이 꼭 있어야 해요.'};
  const rows=[],bad=[];
  aoa.slice(hi+1).forEach((r,i)=>{if(!r||!r.some(v=>String(v==null?'':v).trim()))return;
    if(r.some(v=>/예\s*시/.test(String(v==null?'':v))))return;   // 양식의 예시 줄은 건너뜀
    const g=k=>c[k]>=0?r[c[k]]:'';let ser=String(g('serial')==null?'':g('serial')).replace(/^=?"?|"?$/g,'').replace(/\s+/g,'');
    if(/^0+$/.test(ser))return;   // 예시용 0000… 시리얼은 건너뜀
    if(/e\+/i.test(ser)){bad.push(`${hi+i+2}번째 줄: 시리얼이 ${ser}처럼 깨져 있어요 (엑셀에서 텍스트로 바꿔 주세요)`);return}
    const name=String(g('name')||'').trim(),batch=String(g('batch')||'').trim();
    if(!ser||!name||!batch){bad.push(`${hi+i+2}번째 줄: 상품명·차수·시리얼 중 빈 칸`);return}
    const y=parseInt(String(g('years')||'').replace(/[^\d]/g,''))||0;
    rows.push({date:wDateStr(g('date')),batch,name,serial:ser,model:String(g('model')||'').trim(),years:y});});
  return {rows,bad};
}
async function wImport(){

    상품명이 원가·마진 품목 이름과 같으면 그 품목에 자동으로 연결돼요.</div>
    <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap"><label class="btn" style="cursor:pointer">엑셀 파일 고르기<input type="file" id="xf" accept=".xlsx,.xls,.csv" style="display:none"></label><button class="btn-ghost" id="xt">양식 받기</button></div>
    <div id="xr"></div>`,async d=>{if(!plan){toast('먼저 엑셀 파일을 골라 주세요');return false}await doSave(d);});

function wPlan(rows){
  const all=new Map();WD.serials.forEach(s=>(s.list||[]).forEach(r=>all.set(String(r[0]).toUpperCase(),s)));
  const byName={};rows.forEach(r=>{(byName[r.name]=byName[r.name]||[]).push(r)});
  const names=new Set(WD.book.map(it=>it.name));const prods=[];let addCount=0,skip=0;const conflict=[];
  Object.keys(byName).forEach(name=>{const R=byName[name];const ex=WD.products.find(p=>p.name===name);
    const model=(R.find(r=>r.model)||{}).model||(ex&&ex.model)||'',years=(R.find(r=>r.years)||{}).years||(ex&&ex.years)||5;
    const items=[...new Set([...(ex&&ex.items||[]),...(names.has(name)?[name]:[])])];
    const pp={id:ex?ex.id:'',base:ex,name,model,years,items,isNew:!ex,changed:!ex||model!==(ex.model||'')||Number(years)!==Number(ex.years)||items.length!==(ex.items||[]).length,batches:[]};
    const byB={};R.forEach(r=>{(byB[r.batch]=byB[r.batch]||{batch:r.batch,date:r.date,rows:[]}).rows.push(r)});
    Object.values(byB).forEach(B=>{const cur=ex?(WD.serials.find(s=>s.pid===ex.id&&s.batch===B.batch)||{}).list||[]:[];const add=[];const seen=new Set();
      B.rows.forEach(r=>{const k=r.serial.toUpperCase();if(seen.has(k)){skip++;return}seen.add(k);const h=all.get(k);
        if(h){if(ex&&h.pid===ex.id&&h.batch===B.batch)skip++;else conflict.push(`${r.serial} (이미 ${(WD.products.find(p=>p.id===h.pid)||{}).name||'?'} · ${h.batch})`);return}
        add.push(r.serial)});
      addCount+=add.length;pp.batches.push({batch:B.batch,date:B.date,old:cur,add,count:B.rows.length})});
    prods.push(pp)});
  return {prods,addCount,skip,conflict,total:rows.length};
}

    const html=await r.text();
    const nv=(html.match(/const APP_VER='([^']+)'/)||[])[1]||'';
    let old=null;try{old=localStorage.getItem('cd_html');localStorage.setItem('cd_html',html)}catch(e){}
    if(old===html){if(manual)toast(`지금이 최신 화면이에요 (v${APP_VER})`);return;}
    if(manual){try{sessionStorage.setItem('cd_upd_from',APP_VER)}catch(e){}location.reload();}else newVersionBar(nv);
  }catch(e){if(manual)toast('업데이트 확인 실패: '+e.message)}
}
function newVersionBar(nv){   // 화면이 새로 바뀌었으면 위에 안내 띄우기
  if(document.getElementById('nvb'))return;
  const d=document.createElement('div');d.id='nvb';
  d.style.cssText='position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:70;background:#0f172a;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)';
  d.innerHTML=(nv?`새 화면 v${nv}이 나왔어요`:'새 화면이 나왔어요')+' <button class="btn" style="padding:6px 12px">새로고침</button>';
  d.querySelector('button').onclick=()=>location.reload();document.body.appendChild(d);
}
function alertBox(html){
  const d=document.createElement('div');d.className='modal';
  d.innerHTML=`<div class="login-card" style="text-align:left"><p style="color:var(--ink);font-size:15px;line-height:1.6">${html}</p><button class="btn fld-btn">확인</button></div>`;
  d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);
}

/* 시작 */
initLogin();
(()=>{
  const t=store.get('cd_token');
  let me=null;try{me=JSON.parse(store.get('cd_me')||'null')}catch(e){}
  if(t&&me){TOKEN=t;ME=me;startApp();}   // 로그인 상태면 서버 확인을 기다리지 않고 바로 시작 (만료되면 자동 로그아웃)
  // 다음 접속을 빠르게: 최신 화면을 미리 받아 둠 (GitHub 주소에서 열었을 때)
  // GitHub에 올라온 최신 화면(src/site.html)을 미리 받아 두고, 바뀌었으면 안내
  if(!IN_GAS)setTimeout(()=>checkUpdate(false),2000);
})();
</script>
