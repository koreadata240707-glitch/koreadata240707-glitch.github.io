.login-card h1{font-size:20px;margin:0 0 6px}
.login-card p{color:var(--sub);font-size:14px;margin:0 0 22px}
.fld{width:100%;display:block;margin-bottom:10px;padding:12px 14px;font-size:15px}
.fld-btn{width:100%;padding:12px;font-size:15px}
.login-card a{color:var(--brand);font-weight:600;text-decoration:none}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.login-err{color:var(--bad);font-size:13px;min-height:20px;margin-top:12px}

/* 앱 레이아웃 */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:1600px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top .logo{width:38px;height:38px;margin:0}
.top h2{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:13px;color:var(--sub);white-space:nowrap}
.btn-ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer}
nav{max-width:1600px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:10px 12px;font-size:14px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:1600px;margin:0 auto;padding:16px}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.banner.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.banner.info{background:var(--brand-soft);color:#1e40af}
.updated{font-size:13px;color:var(--sub);margin:0 0 12px}

<script>
// 화면 버전: 화면(src/site.html)을 고쳐 올릴 때마다 0.1씩 올려 주세요 (업데이트 버튼·머리글에 표시)
const APP_VER='5.9';

/* 휴대폰·폴드: 표를 카드로 바꾸기 위한 표시(머리글 이름을 칸마다 붙임). PC 화면에는 영향 없음 */
const M_WIDE=['상품명','옵션명','상품','주문번호','고객','고객명','메모','사유','반품사유','입고 배치(차수)','제품넘버','시리얼','연락처','주소'];
const M_PRI=['입고추천','매출계','순판매수량','상품명','옵션명','주문가능재고','소진예상(일)','매출액','금액','광고매출(14일)','ROAS','반품률','상태','판매수량','현재고','추정이익'];
function mobilizeTables(root){
  (root||document).querySelectorAll('table').forEach(t=>{
    if(t.classList.contains('mc')&&!t.querySelector('tbody tr:not([data-m])'))return;
    const ths=[...t.querySelectorAll('thead th')].map(th=>(th.textContent||'').replace(/\s+/g,' ').trim());
    if(!ths.length)return;
    t.classList.add('mc');
    const many=ths.length>4;
    let pri=[];if(many){for(const n of M_PRI){const i=ths.indexOf(n);if(i>0&&!pri.includes(i))pri.push(i);if(pri.length>=3)break;}
      for(let i=1;pri.length<2&&i<ths.length;i++)if(!pri.includes(i))pri.push(i);}
    t.querySelectorAll('tbody tr:not([data-m])').forEach(tr=>{
      tr.setAttribute('data-m','1');const tds=[...tr.children];if(tds.length<2)return;
      tds.forEach((td,i)=>{td.setAttribute('data-l',ths[i]||'');if(i===0)td.classList.add('mh');if(pri.includes(i))td.classList.add('pri');if(i>0&&M_WIDE.includes(ths[i]))td.classList.add('wide');});
      if(many&&tds.length>pri.length+1){tr.classList.add('mt');const g=document.createElement('td');g.className='mtog';tr.appendChild(g);}
    });
  });
}
document.addEventListener('click',e=>{

const IN_GAS = typeof google!=='undefined' && google.script && google.script.run;
function call(fn, ...args){
  const done=(r,res,rej)=>{
    if(r && r.authError){ logout(true); rej(new Error('다시 로그인해 주세요')); return; }
    if(r && r.error){ rej(new Error(r.error)); return; }
    res(r);
  };
  return new Promise((res,rej)=>{
    if(IN_GAS){
      google.script.run.withSuccessHandler(r=>done(r,res,rej)).withFailureHandler(e=>rej(e))[fn](...args);
      return;
    }
    // 외부 주소(GitHub Pages)에서 열었을 때: 구글 API로 직접 호출
    const go=()=>fetch(API_URL,{method:'POST',body:JSON.stringify({fn,args})}).then(r=>r.json());
    const wait=ms=>new Promise(r=>setTimeout(r,ms));
    go().catch(()=>wait(1500).then(go)).catch(()=>wait(3000).then(go)).catch(()=>wait(5000).then(go))
      .then(j=>{ if(j.error){rej(new Error(j.error));return;} done(j.result,res,rej); })
      .catch(()=>rej(new Error('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.')));
  });
}

/* 칸 채우기: 고객 정보·금액·비용 계산표·특약사항·직인 */

    const blk=e.closest('p,td,li')||col,rg=document.createRange();rg.setStart(blk,0);rg.setEndBefore(e);
    const before=rg.toString().replace(/ /g,' ');
    const gap=v&&before&&!/[\s“"‘'(\[]$/.test(before)?' ':'';
    e.textContent=v?gap+v:' '.repeat(e.dataset.f==='cname'?18:10)});
  const tb=col.querySelector('table[data-ct=pay]');
  if(tb){const it=tb.querySelector('tr[data-row=item]'),sum=tb.querySelector('tr[data-row=sum]');
    if(it&&sum){k.lines.forEach(l=>{const r=it.cloneNode(true);r.removeAttribute('data-row');const td=[...r.cells];
        [l.name,l.qty,won(l.unit),won(l.vat),won(l.total)].forEach((x,i)=>td[i]&&ctCellSet(td[i],x));sum.before(r);});
      it.remove();const sc=[...sum.cells];const tail=[won(k.supply),won(k.vat),won(k.total)];
      for(let i=0;i<3;i++){const td=sc[sc.length-3+i];if(td)ctCellSet(td,tail[i]);}
      sum.setAttribute('data-sum',k.total);}}
  col.querySelectorAll('div[data-ct=gen]').forEach(d=>{

    d.innerHTML=`<p class=MsoNormal style="margin:8pt 0 4pt;font-size:10pt;font-weight:bold">[비용 계산표]</p>

      <tr>${['항목','산정 기준','공급가액(원)','부가세(원)','합계(원)'].map(h=>`<td style="${cell};background:#f2f2f2;text-align:center;font-weight:bold">${h}</td>`).join('')}</tr>
      ${k.lines.map(l=>`<tr><td style="${cell}">${esc(l.name)}</td><td style="${cell}">${esc(l.k==='base'?'-':l.basis)}</td><td style="${cell};text-align:right">${won(l.amt)}</td><td style="${cell};text-align:right">${won(l.vat)}</td><td style="${cell};text-align:right">${won(l.total)}</td></tr>`).join('')}
      <tr><td style="${cell};font-weight:bold" colspan=2>합계 (최종 계약 금액, 부가세 포함)</td><td style="${cell};text-align:right;font-weight:bold">${won(k.supply)}</td><td style="${cell};text-align:right;font-weight:bold">${won(k.vat)}</td><td style="${cell};text-align:right;font-weight:bold">${won(k.total)}</td></tr></table>`;
  });
  const lines=String(c.f.special||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
  col.querySelectorAll('div[data-sp]').forEach(d=>{
    d.innerHTML='';if(!lines.length)return;

    const head=[...col.querySelectorAll('p')].find(p=>/^\s*제\s*\d+\s*조/.test(p.textContent)),item=col.querySelector('p.MsoListParagraph');
    const h=(head||document.createElement('p')).cloneNode(false);h.textContent='[특약사항]';d.appendChild(h);
    lines.forEach((s,i)=>{const p=(item||document.createElement('p')).cloneNode(false);p.textContent=`(${i+1}) ${s}`;d.appendChild(p);});
    const sp=document.createElement('p');sp.innerHTML='&nbsp;';d.appendChild(sp);
  });
  if(opt&&opt.seal){const img=CT.seals[ctSealKey(c)];const box=col.querySelector('[data-seal]');
    if(img&&box){const p=[...box.querySelectorAll('p')].filter(p=>/\(\s*인\s*\)/.test(p.textContent)).pop();
      if(p){// 문단 끝의 "(인)" 의 '인' 글자 바로 앞에 직인을 겹쳐 놓음 ('날인'의 인이 아니라)
        const w=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);const ns=[];let n;while((n=w.nextNode()))ns.push(n);
        const all=ns.map(x=>x.data).join(''),m=/\(\s*(인)\s*\)[^()]*$/.exec(all);

/* 본문을 A4 페이지로 나눔. 원본 양식의 섹션(페이지 묶음)·여백을 그대로 따름 */
async function ctBuild(c,opt){
  opt=opt||{};
  const key=ctTplKey(c),t=await ctTpl(key,c.tplVer);
  let host=document.getElementById('ctHost');if(!host){host=document.createElement('div');host.id='ctHost';document.body.appendChild(host);}
  const lh=Number(t.lh)||1;
  host.innerHTML=`<style>${ctFontCss(t.css,lh)}</style>`;
  host.style.setProperty('--ctlh',lh);
  const vals=ctValues(c),k=ctCalc(c.f),pages=[];
  for(const s of (c.body||t.sections)){
    const [mt,mr,mb,ml]=ctMargins(s.margin),W=CT_PW-ml-mr,H=CT_PH-mt-mb;
    const col=document.createElement('div');col.className=`ctcol tpl-${key}`;col.style.width=W+'px';col.innerHTML=ctLH(s.html,lh);host.appendChild(col);
    ctFill(col,c,vals,k,opt);
    const top0=col.getBoundingClientRect().top;
    const blocks=[...col.children].map(b=>{const r=b.getBoundingClientRect(),cs=getComputedStyle(b);
      return {b,top:r.top-top0-(parseFloat(cs.marginTop)||0),bot:r.bottom-top0+(parseFloat(cs.marginBottom)||0)}});
    /* 쪽 나누기: 원본 워드에서 다음 쪽에 있던 덩어리(data-wp)는 새 쪽에서 시작(원본과 같은 쪽 구성).
       내용이 늘어 한 번 넘치면 그 뒤로는 원본 쪽 나눔 대신 자연스럽게 이어 씀. 조항 제목은 쪽 끝에 혼자 두지 않음 */
    const isHead=b=>/^\s*(제\s*\d+\s*조|\[특약사항\]|\[\s*“?[갑을]”?\s*회사정보\])/.test(b.textContent||'');
    const pos=new Map(blocks.map(x=>[x.b,x]));
    let cur=null,start=0,wp=0,flow=false;
    const newPage=()=>{const pg=document.createElement('div');pg.className='ctpage';pg.style.setProperty('--ctlh',lh);
      const inner=document.createElement('div');inner.className=`ctin tpl-${key}`;
      inner.style.cssText=`top:${mt}px;left:${ml}px;width:${W}px;height:${H}px`;
      pg.appendChild(inner);host.appendChild(pg);cur={pg,inner,H};pages.push(cur);};
    for(const x of blocks){
      const w=Number(x.b.getAttribute('data-wp'))||0,boundary=w>wp&&wp>0;if(w)wp=Math.max(wp,w);
      const over=cur&&x.bot-start>H&&cur.inner.children.length;
      if(!cur||(boundary&&!flow)||over){
        const prev=cur;newPage();start=x.top;
        if(over){flow=true;
          const last=prev.inner.lastElementChild;
          if(last&&prev.inner.children.length>1&&isHead(last)){cur.inner.appendChild(last);start=pos.get(last).top;}}
      }
      cur.inner.appendChild(x.b);
    }
    col.remove();
  }
  pages.forEach((p,i)=>{
    if(i===0&&c.id){const n=document.createElement('div');n.className='ctno';n.style.top='14px';n.textContent='계약번호: '+c.id;p.pg.appendChild(n);}
    if(opt.draft){const w=document.createElement('div');w.className='ctwm';w.innerHTML='<span>검토용 초안 · 발행 전</span>';p.pg.appendChild(w);}
    if(opt.seal&&opt.gan&&CT.seals[ctSealKey(c)]){const g=document.createElement('div');g.className='ctgan';g.innerHTML=`<img alt="간인" src="${CT.seals[ctSealKey(c)]}">`;p.pg.appendChild(g);}
  });
  return {host,pages:pages.map(p=>p.pg),checks:ctChecks(c,t,pages,vals,k,opt)};
}
/* 필수 검증: 금액 일치 · 고객 정보 · 조항/페이지 누락 · 넘침 · 글꼴 */
function ctChecks(c,t,pages,vals,k,opt){
  const out=[],add=(ok,msg)=>out.push({ok,msg});
  const txt=pages.map(p=>p.pg.textContent).join('\n');
  if(c.type!=='nda'){
    const sumEl=pages.map(p=>p.pg.querySelector('[data-sum]')).find(Boolean);
    const totEl=pages.map(p=>p.pg.querySelector('[data-f=total]')).find(Boolean);
    const okSum=sumEl&&Number(sumEl.getAttribute('data-sum'))===k.total&&sumEl.textContent.includes(won(k.total));
    const okTot=totEl&&totEl.textContent.replace(/[^\d]/g,'')===String(k.total);
    const okParts=[k.supply,k.vat].every(n=>txt.includes(won(n)));
    add(!!(okSum&&okTot&&okParts&&k.total>0),`금액 일치: 화면 ${won(k.total)}원 = 계약서 표·본문 ${totEl?totEl.textContent.trim():'없음'}원`);
  }
  const miss=ctNeed(c).filter(x=>!vals[x]);
  add(!miss.length,miss.length?`비어 있는 ${ctIsInd(c)?'갑·건명':'고객'} 정보: ${miss.map(x=>CT_FL[x]).join(', ')}`:ctIsInd(c)?'갑(법인)·을(개인사업자)·건명 자동 입력 확인':'고객사 정보 자동 입력 확인 (회사명·사업자번호·대표자·주소·계약일)');
  const heads=el=>[...el.querySelectorAll('p')].filter(p=>/^\s*제\s*\d+\s*조/.test(p.textContent)).length;
  const tmp=document.createElement('div');tmp.innerHTML=(c.body||t.sections).map(s=>s.html).join('');
  const want=heads(tmp),got=pages.reduce((s,p)=>s+heads(p.pg),0);
  add(want===got&&want>0,`계약 조항 ${got}/${want}개 포함 · ${pages.length}쪽`);
  const over=pages.map((p,i)=>{const top=p.inner.getBoundingClientRect().top;
    const bot=[...p.inner.children].filter(b=>(b.textContent||'').replace(/ /g,' ').trim()).reduce((m,b)=>Math.max(m,b.getBoundingClientRect().bottom-top),0);
    return bot>p.H+2?i+1:0}).filter(Boolean);
  add(!over.length,over.length?`${over.join(', ')}쪽 내용이 아래로 넘쳐요 (본문 직접 수정으로 줄여 주세요)`:'페이지 넘침 없음 (A4)');
  const font=document.fonts&&document.fonts.check?(document.fonts.check('12px "Malgun Gothic"')||document.fonts.check('12px Pretendard')):true;
  add(font,font?'한글 글꼴 확인 (맑은 고딕/Pretendard)':'한글 글꼴을 못 찾았어요');
  if(opt.seal&&!CT.seals[ctSealKey(c)])add(false,'직인 이미지가 등록되지 않았어요 (양식·직인 관리)');
  return out;
}

function ctApprView(c,m){
  const el=$('ctAppr');if(!el)return;const a=c.approval||{};
  const who=x=>x?`<span class="ctok">✓</span> ${esc(x.by)} <span class="muted">${esc(x.at)}</span>`:'<span class="muted">대기</span>';
  let html=`<div class="ctchk"><div>법률 검토: ${who(a.legal)}</div><div>세무 검토: ${who(a.tax)}</div><div>발행 승인: ${who(a.approved)}</div></div>`;
  const act=[];
  if(!c.id)html+='<div class="muted" style="font-size:12px;margin-top:6px">먼저 저장해야 검토를 요청할 수 있어요. 승인 전 PDF에는 "검토용 초안" 표시가 들어가고 직인이 빠져요.</div>';
  else if(c.status==='작성중')act.push(['request','검토 요청']);
  else if(c.status==='검토요청'){if(!a.legal)act.push(['legal','법률 검토 완료']);if(!a.tax)act.push(['tax','세무 검토 완료']);if(a.legal&&a.tax)act.push(['approve','발행 승인']);act.push(['reject','반려(다시 작성)']);}
  if(c.id&&!['체결','취소'].includes(c.status))act.push(['cancel','계약 취소']);
  if(c.id&&c.status==='취소'){act.push(['reopen','다시 작성']);act.push(['delete','계약서 지우기'])}   // 지우기는 취소된 계약서만
  html+=act.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${act.map(([k,l])=>`<button class="btn ${k==='approve'?'':'sec'}" style="padding:6px 10px;font-size:12.5px${k==='delete'?';color:#b91c1c':''}" data-ca="${k}">${l}</button>`).join('')}</div>`:'';
  if(c.id&&c.status==='취소')html+='<div class="muted" style="font-size:12px;margin-top:6px">취소된 계약서만 지울 수 있어요. 지우면 계약 이력에서 사라지고, PDF·서명본과 1. 사건 자료함 3. 견적서및계약서 칸의 사본은 드라이브 휴지통으로 가요 (30일 안에 되살릴 수 있어요).</div>';
  el.innerHTML=html;
  el.querySelectorAll('[data-ca]').forEach(x=>x.onclick=async()=>{

async function ctBizRead(file,f,lock,redraw){
  if(!file||lock)return;if(file.size>10*1024*1024){toast('10MB 이하 파일만 읽을 수 있어요');return}
  const mime=file.type||(/\.pdf$/i.test(file.name)?'application/pdf':'');
  if(!/^(image\/(png|jpe?g|gif|bmp|webp)|application\/pdf)$/.test(mime)){toast('JPG·PNG 사진이나 PDF만 읽을 수 있어요');return}
  const lab=$('ctBizLab'),sp=lab&&lab.querySelector('span'),old=sp&&sp.textContent;if(sp)sp.textContent='읽는 중…';if(lab)lab.classList.add('busy');
  try{const r=await call('ctOcr',TOKEN,mime,await ctB64(file));const got=ctParseBiz(r.text||''),keys=Object.keys(got);
    if(!keys.length){toast('글자를 못 읽었어요. 더 선명한 사진으로 다시 올리거나 직접 입력해 주세요.');return}
    const cur=k=>{const e=$('ct_'+k);return String(e?e.value:f[k]||'').trim()};
    const diff=keys.filter(k=>cur(k)&&cur(k)!==got[k]);
    if(diff.length&&!confirm(`이미 입력된 ${diff.map(k=>CT_FL[k]).join(', ')}을(를) 사업자등록증 내용으로 바꿀까요?`))return;
    keys.forEach(k=>{f[k]=got[k];const e=$('ct_'+k);if(e){e.value=got[k];e.classList.add('ctfilled')}});
    redraw();toast(`${keys.length}칸을 채웠어요. 노란 칸이 맞는지 확인해 주세요.`);
  }catch(e){toast(e.message)}finally{if(sp)sp.textContent=old;if(lab)lab.classList.remove('busy')}
}

/* 미리보기 · PDF · 인쇄 */
async function ctPreview(c,mode,readonly){
  const final=ctIsFinal(c);
  const ov=document.createElement('div');ov.className='ctmodal';
  ov.innerHTML=`<div class="ctmbar"><b>${esc(CT_TYPES[c.type])} · ${esc(ctIsInd(c)?(ctCase(c.f.caseName)||'건명 미입력'):(c.f.cname||'고객사 미입력'))} ${final?'':'<span class="ctst" style="background:#dc2626;margin-left:6px">검토용 초안</span>'}</b>
    ${final&&CT.seals[ctSealKey(c)]?'<label style="font-size:13px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="ctSeal" checked> 직인 넣기</label><label style="font-size:13px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="ctGan" checked> 페이지마다 간인</label>':''}
    <button class="btn ct-2line" id="ctMPdf" style="background:#0f766e">${final?'PDF 계약서 생성':'초안 PDF 받기'}<small class="ct-sub">(드라이브 자동 생성)</small></button><button class="btn sec" id="ctMPrint">인쇄</button><button class="btn sec" id="ctMClose">닫기</button></div>
    <div class="ctmbody"><div class="ctpages" id="ctPages"><div class="loading" style="color:#fff"><div class="spin"></div>페이지 만드는 중…</div></div><div class="ctcheck" id="ctChecks"></div></div>`;
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  const close=()=>{ov.remove();document.body.style.overflow='';const h=$('ctHost');if(h)h.innerHTML=''};
  $('ctMClose').onclick=close;
  let built=null;
  const draw=async()=>{
    const seal=final&&!!($('ctSeal')&&$('ctSeal').checked),gan=seal&&!!($('ctGan')&&$('ctGan').checked);
    try{built=await ctBuild(c,{draft:!final,seal,gan})}catch(e){$('ctPages').innerHTML=`<div class="banner err">${esc(e.message)}</div>`;return}
    const wrap=$('ctPages');const w=Math.min(CT_PW,wrap.clientWidth-8),sc=w/CT_PW;
    wrap.innerHTML=built.pages.map((p,i)=>`<div class="ctpwrap" style="width:${w}px;height:${CT_PH*sc}px" data-i="${i}"></div>`).join('');
    wrap.querySelectorAll('.ctpwrap').forEach((x,i)=>{const cl=built.pages[i].cloneNode(true);cl.style.transform=`scale(${sc})`;x.appendChild(cl)});
    const ck=built.checks;
    $('ctChecks').innerHTML=`<h4>필수 검증</h4>${ck.map(x=>`<div>${x.ok?'<span class="ctok">✓</span>':'<span class="ctbad">✗</span>'} ${esc(x.msg)}</div>`).join('')}
      <div class="muted" style="margin-top:8px;font-size:12px">${final?'승인된 계약서예요. PDF를 만들면 계약 이력에 발행본으로 저장돼요.':'검토·승인 전이라 "검토용 초안" 표시가 들어가고 직인·간인이 빠져요. 초안 PDF도 이력에 저장돼요.'}</div>
      ${final?(CT.seals[ctSealKey(c)]?'<div class="muted" style="margin-top:6px;font-size:12px">간인: 모든 페이지 오른쪽 가운데에 우리 직인이 찍혀요. 위쪽 "페이지마다 간인"으로 끄고 켤 수 있어요.</div>'
        :'<div class="ctwarn" style="margin-top:8px;font-size:12px">직인이 아직 등록되지 않아 서명란 직인과 페이지 간인이 빠져요. [양식·직인 관리]에서 직인 PNG를 올려 주세요.</div>'):''}
      <div class="muted" style="margin-top:6px;font-size:12px">파일명: ${esc(ctFileName(c))}</div>`;
    return built;
  };
  await draw();
  const sl=$('ctSeal');if(sl)sl.onchange=draw;const gl=$('ctGan');if(gl)gl.onchange=draw;
  $('ctMPrint').onclick=()=>{if(built)ctPrint(built)};

    if(!readonly&&!c.id&&!confirm('아직 저장하지 않은 계약서예요. 이력에 남지 않는 PDF를 받을까요? (저장하면 이력에 남아요)'))return;
    const btn=$('ctMPdf');btn.disabled=true;btn.textContent='PDF 만드는 중…';
    try{
      const blob=await ctPdf(c,built.pages,(i,n)=>{btn.textContent=`PDF 만드는 중… ${i}/${n}쪽`});const name=ctFileName(c);
      ctSaveBlob(blob,name);
      if(c.id&&!readonly){btn.textContent='이력에 저장 중…';
        const r=await call('ctUpload',TOKEN,c.id,final?'pdf':'draft',name,'application/pdf',await ctB64(blob),c.ver);
        Object.assign(c,r.contract);ctSyncList(r.contract);toast(final?'PDF를 받고 발행본으로 저장했어요':'초안 PDF를 받고 이력에 저장했어요');
        if(CT.cur===c&&$('ctBody')&&CT.sub==='new')ctFormView($('ctBody'),document.getElementById('main'));

  };
  if(mode==='pdf')$('ctMPdf').click();
  if(mode==='print')$('ctMPrint').click();
}

function rpShrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{

async function rpSaveNow(m,head){
  if(RP_BUSY){toast('사진을 올리는 중이에요. 끝난 뒤에 저장해 주세요');return}
  const R=RP,miss=[['cname','고객사명'],['date','작성일'],['writer','작성자']].filter(([k])=>!String(R.f[k]||'').trim());
  if(miss.length){toast('먼저 넣어 주세요: '+miss.map(x=>x[1]).join(', '));return}
  const btn=$('rpSave');btn.disabled=true;btn.textContent='저장 중…';
  try{const r=await call('rpSave',TOKEN,{id:R.id,f:R.f});RP=r.report;
    const s={id:RP.id,company:RP.f.company,cname:RP.f.cname,date:RP.f.date,writer:RP.f.writer,title:RP.f.title,updated:RP.updated,ver:RP.ver,files:(RP.files||[]).length};
    const i=RPL.findIndex(x=>x.id===s.id);if(i>=0)RPL[i]=s;else RPL.unshift(s);
    toast(`저장했어요 · ${RP.id} v${RP.ver}`);rpView(m,head);}
  catch(e){toast(e.message);btn.disabled=false;btn.textContent='저장'}
}

/* 전체 파일 다운로드(zip): 서버에서 8MB씩 받아 브라우저에서 바로 zip으로 묶음 (압축 없이 묶기만 → 빠르고 큰 파일도 됨).
   PC 크롬·엣지는 저장 위치를 먼저 고르고 받는 대로 디스크에 씀(메모리 부담 없음). 그 밖에는 다 받은 뒤 한 번에 저장 */
async function csZipAll(k){
  if(CS_BUSY){toast('지금 올리거나 받는 중이에요');return}
  const zname=(String(k.name||'사건').replace(/[\\/:*?"<>|]+/g,'_'))+'.zip';
  let writer=null;
  if(window.showSaveFilePicker){
    try{const h=await window.showSaveFilePicker({suggestedName:zname,types:[{description:'ZIP 파일',accept:{'application/zip':['.zip']}}]});writer=await h.createWritable()}
    catch(e){if(e&&e.name==='AbortError')return;writer=null}
  }
  CS_BUSY=true;
  const box=document.getElementById('csUpBox')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'csUpBox'}));box.className='cs-upbox';
  const paint=(title,p,line,f,stage)=>{box.innerHTML=`<b>${title}</b><div class="cs-pbar"><i style="width:${p}%"></i></div><span>${line}</span>${f?`<span class="f">${esc(f)}</span>`:''}${stage?`<small>${stage}</small>`:''}`};
  const stay=e=>{e.preventDefault();e.returnValue=''};window.addEventListener('beforeunload',stay);
  try{
    paint('📦 전체 파일 다운로드 준비 중…',0,'파일 목록을 불러오는 중','','');
    const L=await call('rsZipList',TOKEN,k.id);
    if(!L.files.length){box.remove();toast('받을 파일이 없어요');if(writer)await writer.abort();return}
    if(!window.fflate)await ctScript('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js');
    const parts=[];let q=Promise.resolve(),werr=null;
    const zip=new fflate.Zip((err,dat)=>{if(err){werr=err;return}if(writer)q=q.then(()=>writer.write(dat));else parts.push(dat)});
    const total=L.files.reduce((a,f)=>a+(f.size||0),0)||1;let done=0;
    for(let i=0;i<L.files.length;i++){const f=L.files[i],ent=new fflate.ZipPassThrough(f.path+f.name);zip.add(ent);
      if(!f.size){ent.push(new Uint8Array(0),true);continue}
      for(let s=0;;){
        paint(`📦 받는 중 ${Math.min(99,Math.floor(done/total*100))}%`,Math.floor(done/total*100),`${i+1}/${L.files.length}개 · ${csSize(done)} / ${csSize(total)}`,f.path+f.name,'다 받을 때까지 창을 닫거나 새로고침하지 마세요');
        const r=await call('rsChunk',TOKEN,k.id,f.id,s),bin=atob(r.b64||''),u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);
        s+=u.length;done+=u.length;const last=!u.length||s>=f.size;ent.push(u,last);if(werr)throw werr;
        if(last)break;
      }
      await q;
    }
    zip.end();await q;if(werr)throw werr;
    if(writer)await writer.close();else ctSaveBlob(new Blob(parts,{type:'application/zip'}),zname);
    paint(`✅ ${L.files.length}개를 zip으로 받았어요`,100,`${csSize(total)} · ${esc(zname)}`,'',L.skip&&L.skip.length?`구글 문서·시트 ${L.skip.length}개는 zip에 못 넣어요 (드라이브 바로가기에서 받아 주세요)`:'');
    setTimeout(()=>{if(!CS_BUSY)box.remove()},6000);
  }catch(e){box.remove();toast('전체 다운로드 실패: '+e.message);if(writer){try{await writer.abort()}catch(e2){}}}
  finally{CS_BUSY=false;window.removeEventListener('beforeunload',stay)}
}

/* ═══════ 9. 누적 계약 진행사항 ═══════
   구글 시트 '연도별_HK정산'(2026.HK · 2025.HK …)을 그대로 보여 줌. 노란(입력) 칸을 눌러 고치면 그 칸만 시트에 바로 저장되고,
   계산 칸(공급가액·부가세·수익 등)은 시트 수식이 계산함. 합친 칸(1-1차·1-2차)도 시트처럼 합쳐서 보여 줌 */
let HK=null,HK_BUSY=false,HK_FULL=false,HK_X=0,hkFit=()=>{},hkUp=()=>{},hkEsc=()=>{};
const hkNum=s=>{const t=String(s==null?'':s).replace(/[,\s원₩]/g,'');return /^-?\d+(\.\d+)?$/.test(t)?Number(t):null};
const hkFmt=n=>(n<0?'-':'')+Math.abs(Math.round(n)).toLocaleString('ko-KR');
const hkKey=l=>String(l||'').replace(/\s/g,'');
const hkIsDate=l=>hkKey(l)==='송금일자';
const hkIsOX=l=>['계약서','입금','계산서'].includes(hkKey(l));
function hkIso(s){const m=/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(String(s||''));return m?`${m[1]}-${('0'+m[2]).slice(-2)}-${('0'+m[3]).slice(-2)}`:''}
async function hkLoad(name){const r=await call('hkInit',TOKEN,name||'');HK=r;return r}
async function hkView(m,head){
  if(!ctHere('hk'))return;
  const top=`<div class="ctmode"><b>9. 누적 계약 진행사항</b> · 구글 시트 '연도별_HK정산'과 연결돼 있어요 · <b>노란 칸</b>만 눌러 고치면 바로 시트에 저장되고, 나머지 칸은 시트 수식이 계산해요</div>`;
  if(!HK){m.innerHTML=head+top+'<div class="loading"><div class="spin"></div>시트를 불러오는 중…</div>';
    try{await hkLoad()}catch(e){if(ctHere('hk'))m.innerHTML=head+top+`<div class="banner err">${esc(e.message)}</div><button class="btn sec" id="hkRetry">↻ 다시 불러오기</button>`;const b=$('hkRetry');if(b)b.onclick=()=>{HK=null;hkView(m,head)};return}
    if(!ctHere('hk'))return;}
  const T=HK,re=()=>hkView(m,head),C=T.cols,N=C.length,rowIdx={};T.rows.forEach((x,i)=>rowIdx[x.r]=i);
  // 합친 칸: 시작 칸에 rowspan/colspan (보이는 줄만 셈), 나머지 칸은 그리지 않음
  const span={},skip={};
  T.merges.forEach(x=>{if(x.rs<2&&x.cs<2)return;const vis=T.rows.filter(y=>y.r>=x.r&&y.r<x.r+x.rs);if(!vis.length)return;
    span[vis[0].r+':'+x.c]={rs:vis.length,cs:x.cs};vis.forEach(y=>{for(let c=x.c;c<x.c+x.cs;c++)if(y.r!==vis[0].r||c!==x.c)skip[y.r+':'+c]=1})});
  // 숫자 칸 합계 (합친 칸은 한 번만 셈 · % · 날짜 · 사업자 번호 칸은 빼고)
  const numCol=C.map((col,i)=>{if(col.label==='%'||hkIsDate(col.label)||/사업자번호/.test(hkKey(col.label)))return false;

    hkUp=()=>{if(dx&&moved)setTimeout(()=>{moved=false},0);dx=null;wr.classList.remove('drag')};
    wr.onmousemove=e=>{if(!dx)return;const mx=e.clientX-dx.x,my=e.clientY-dx.y;if(!moved&&Math.abs(mx)+Math.abs(my)<6)return;moved=true;wr.classList.add('drag');wr.scrollLeft=dx.l-mx;wr.scrollTop=dx.t-my;e.preventDefault()};

    catch(e){toast(e.message);const b=$('hkYearGo');if(b)b.disabled=false}finally{HK_BUSY=false}};

async function hkSave(td,m,head,val){
  if(HK_BUSY){toast('저장 중이에요. 잠시 뒤 다시 눌러 주세요');return}
  const name=HK.name,r=+td.dataset.r,c=+td.dataset.c;HK_BUSY=true;td.classList.add('saving');
  try{HK=await call('hkSet',TOKEN,name,r,c,val);toast('시트에 저장했어요')}catch(e){toast(e.message)}
  finally{HK_BUSY=false;if(ctHere('hk'))hkView(m,head)}
}
function hkEdit(td,m,head){
  if(td.querySelector('input')||HK_BUSY)return;
  const i=+td.dataset.i,col=HK.cols[i],old=td.textContent;
  if(hkIsOX(col.label)){hkSave(td,m,head,old.trim()?'':'ㅇ');return}   // ㅇ ↔ 빈칸
  const date=hkIsDate(col.label),num=hkNum(old)!==null||td.classList.contains('y');
  const inp=document.createElement('input');inp.type=date?'date':'text';inp.value=date?hkIso(old):(hkNum(old)!==null?String(hkNum(old)):old);
  if(num&&!date)inp.inputMode='numeric';
  td.textContent='';td.appendChild(inp);inp.focus();if(inp.select&&!date)inp.select();
  let done=false;const fin=save=>{if(done)return;done=true;const v=inp.value;
    const same=date?v===hkIso(old):(hkNum(old)!==null?hkNum(v)===hkNum(old):v===old);
    if(!save||same){td.textContent=old;return}hkSave(td,m,head,v)};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fin(true)}else if(e.key==='Escape'){e.preventDefault();fin(false)}};
  inp.onblur=()=>fin(true);
}
/* 상단 큰 구분: 1. 매출 대시보드 / 2. 복구 프로젝트 (관리자만 보임).

function ctSec(on){const s=document.getElementById('secsw');if(!s)return;s.hidden=!on;

function buildNav(){
  const tabs=TABS.filter(t=>(!t.admin||ME.role==='관리자')&&(!t.need||Number((DATA.kpi||{})[t.need])===1));
  document.getElementById('nav').innerHTML=tabs.filter(t=>t.id!=='contract').map(t=>`<button data-t="${t.id}">${t.label}</button>`).join('');
  document.getElementById('nav').onclick=e=>{const t=e.target.dataset.t;if(t)show(t)};
  if(!tabs.some(t=>t.id===TAB))TAB='home';
  ctSec(tabs.some(t=>t.id==='contract'));
  drawBell();
}
/* 알림 종: 수집 프로그램이 요약지표 '알림' 칸에 넣은 Wing 알림·미답변 문의·계정 제재 */
let BELL_TAB='전체';
function bellData(){try{return JSON.parse((DATA&&DATA.kpi&&DATA.kpi['알림'])||'{}')}catch(e){return {}}}
function bellKey(it){return it.type+'|'+it.title+'|'+(it.text||'')+'|'+(it.count||'')}
function bellSeen(){try{return JSON.parse(localStorage.getItem('cd_bell_seen')||'[]')}catch(e){return []}}
function drawBell(){
  const B=bellData(),items=B.items||[],seen=new Set(bellSeen());
  const unread=items.filter(it=>!seen.has(bellKey(it))).length;
  const c=$('bellCnt');if(c){c.hidden=!unread;c.textContent=unread>99?'99+':unread;}
  const p=$('bellPanel');if(!p||p.hidden)return;
  const kinds=['전체','문의','센터','재고','가격','Wing','위반'].filter(k=>k==='전체'||items.some(it=>it.type===k));
  if(!kinds.includes(BELL_TAB))BELL_TAB='전체';
  const list=items.filter(it=>BELL_TAB==='전체'||it.type===BELL_TAB);
  const at=B.at?new Date(B.at+':00Z').toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
  p.innerHTML=`<div class="bph"><b>알림</b><span>Wing 확인 ${esc(at)}</span></div>
    <div class="btabs">${kinds.map(k=>`<button data-k="${k}" class="${k===BELL_TAB?'on':''}">${k==='센터'?'고객센터':k} ${k==='전체'?items.length:items.filter(it=>it.type===k).length}</button>`).join('')}</div>
    ${list.length?list.map(it=>`<a class="bit" href="${esc(it.url||'https://wing.coupang.com')}" target="_blank" rel="noopener"><div class="bdot t${esc(it.type)}">${esc(it.type==='센터'?'센터':it.type)}</div><div style="min-width:0"><b>${esc(it.title)}${seen.has(bellKey(it))?'':'<span class="bnew"></span>'}</b>${it.text?`<p>${esc(it.text)}</p>`:''}</div>${it.at?`<small>${esc(it.at.slice(5).replace('T',' '))}</small>`:''}</a>`).join(''):'<div class="bempty">새 알림이 없어요</div>'}
    <div class="bpf">누르면 Wing 해당 화면이 열려요 · 답변·처리는 Wing에서 해 주세요</div>`;
  p.querySelector('.btabs').onclick=e=>{const k=e.target.dataset.k;if(k){BELL_TAB=k;drawBell();}};
}
function toggleBell(){
  const p=$('bellPanel');p.hidden=!p.hidden;drawBell();
  if(!p.hidden){try{localStorage.setItem('cd_bell_seen',JSON.stringify((bellData().items||[]).map(bellKey)))}catch(e){}
    setTimeout(()=>{const c=$('bellCnt');if(c)c.hidden=true},300);}
}

/* 화면을 켜 두면 3분마다 새 데이터를 확인해서 바뀌었으면 자동으로 다시 그림 (입력 화면은 제외) */
function autoRefresh(){
  if(window.__ar)return;window.__ar=setInterval(async()=>{
    if(document.hidden||!TOKEN||document.querySelector('.modal'))return;
    try{const fresh=await call('getData',TOKEN);if(JSON.stringify(fresh)===JSON.stringify(DATA))return;
      DATA=fresh;try{store.set('cd_data',JSON.stringify(fresh))}catch(e){}
      if(['costs','staff','warranty','contract'].includes(TAB))return;
      const y=window.scrollY;buildNav();show(TAB,'replace');window.scrollTo(0,y);
    }catch(e){}
  },180000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOKEN&&Date.now()-(window.__arLast||0)>60000){window.__arLast=Date.now();
    call('getData',TOKEN).then(fresh=>{if(JSON.stringify(fresh)===JSON.stringify(DATA))return;DATA=fresh;try{store.set('cd_data',JSON.stringify(fresh))}catch(e){}
      if(!['costs','staff','warranty','contract'].includes(TAB)){const y=window.scrollY;buildNav();show(TAB,'replace');window.scrollTo(0,y)}}).catch(()=>{})}});
}

      if(c==='반품률')return v===''?'-':Number(v)>=0.1?`<span class="down">${pct(v)}</span>`:pct(v);

/* 재고 */
function renderStock(m,head){
  const all=DATA.inventory||[];
  const dead=r=>r['상태']==='품절'&&!Number(r['최근30일판매']);   // 재고 0 + 최근 30일 판매 0 = 지금은 안 쓰는 옵션
  const cnt=s=>all.filter(r=>r['상태']===s).length;
  const hasW=all.some(r=>r['입고추천']!==undefined&&r['아이템위너']!==undefined&&(r['아이템위너']||r['Wing소진(일)']!==''));
  const F={'발주':r=>cnum(r['입고추천'])>0,'과잉':r=>cnum(r['과잉수량'])>0,'위너':r=>r['아이템위너']==='위너 아님'};
  let sp={};try{sp=JSON.parse((DATA.kpi||{})['판매자 정보']||'{}')}catch(e){}
  const best=sp.best||{};
  m.innerHTML=head+`<div class="card"><h3><span>로켓그로스 재고 현황</span><span class="muted">${esc((all[0]||{})['조회시각']||'')}</span></h3>
  <div class="toolbar"><span class="seg" id="segK"><button data-s="" class="on">전체 ${all.length}</button><button data-s="품절">품절 ${cnt('품절')}</button><button data-s="부족">부족 ${cnt('부족')}</button><button data-s="정상">정상 ${cnt('정상')}</button>${hasW?`<button data-s="발주">발주 필요 ${all.filter(F['발주']).length}</button><button data-s="과잉">과잉 ${all.filter(F['과잉']).length}</button><button data-s="위너">위너 아님 ${all.filter(F['위너']).length}</button>`:''}</span>

  <p class="muted">남은 재고 많은 순 · 부족 = 최근 30일 판매 속도로 14일 안에 소진 예상${hasW?` · <b>입고 추천</b> = 쿠팡 Wing 재고현황의 권장 입고 수량 · 줄을 누르면 상세${best.sellerScoreNum!=null?` · 판매자 점수 ${esc(best.sellerScoreNum)} · 아이템위너 비율 ${esc(best.itemWinnerRatio)}%`:''}`:''}</p>
  <div class="tbl-wrap" id="kt"></div></div>`;
  let st='';
  const DCOL=['입고중','과잉수량','월보관비','품절로놓친매출30일','조회30일','판매30일','취소30일','구매전환율','반품30일','반품률3개월','반품사유','아이템위너','판매가','개당 쿠팡 비용'];
  const dval=(c,r)=>{
    if(c==='구매전환율'){const pv=cnum(r['조회30일']),u=cnum(r['판매30일']);return pv?(u/pv*100).toFixed(1)+'%':'-';}
    if(c==='반품률3개월'){const v=r[c];return v===''||v==null?'-':(Number(v)*100).toFixed(1)+'%'+(r['반품률상태']?` (${esc(r['반품률상태'])})`:'');}
    if(c==='개당 쿠팡 비용'){const a=cnum(r['개당판매수수료']),b=cnum(r['개당배송비']),d=cnum(r['개당입출고비']);return a+b+d?`${won(a+b+d)} <span class="muted">(수수료 ${won(a)} · 배송 ${won(b)} · 입출고 ${won(d)})</span>`:'-';}
    if(c==='반품사유'||c==='아이템위너')return esc(r[c]||'-');
    const v=r[c];return v===''||v==null?'-':won(v);};
  const draw=()=>{const q=document.getElementById('kq').value.trim().toLowerCase();
    const hide=document.getElementById('kh').checked;
    const rows=all.filter(r=>(!hide||!dead(r))&&(!st||(F[st]?F[st](r):r['상태']===st))&&(!q||(String(r['상품명'])+' '+r['옵션명']+' '+r['판매자SKU']).toLowerCase().includes(q)))

    const cols=['상태','상품명','옵션명','판매자SKU','주문가능재고','최근30일판매','일평균판매','소진예상(일)'].concat(hasW?['입고추천'].concat(DCOL):[]);
    document.getElementById('kt').innerHTML=table(cols,rows,
      c=>(['상태','상품명','옵션명','판매자SKU'].includes(c)?'l':'')+(DCOL.includes(c)?' dcol':''),(c,v,r)=>{
        if(c==='상태')return `<span class="pill ${v==='품절'?'bad':v==='부족'?'warn':'ok'}">${esc(v)}</span>`;
        if(c==='상품명'||c==='옵션명')return `<span class="name">${esc(v)}</span>`;
        if(c==='판매자SKU')return esc(v);
        if(c==='입고추천'){const n=cnum(v),d=r['추천기한(일)'];return n?`<b class="${cnum(d)<=7?'down':''}">${won(n)}개</b>${d!==''?` <span class="muted">· ${esc(d)}일 안에</span>`:''}`:'<span class="muted">-</span>';}
        if(DCOL.includes(c))return dval(c,r);
        if(v==='')return '-';
        return won(v);});
    // PC: 줄을 누르면 아래에 상세 펼치기 (휴대폰은 카드의 ▾ 자세히)
    if(hasW)document.querySelectorAll('#kt tbody tr').forEach((tr,i)=>{tr.classList.add('click');tr.onclick=()=>{
      if(window.matchMedia('(max-width:700px)').matches)return;
      const nx=tr.nextElementSibling;if(nx&&nx.classList.contains('kdet')){nx.remove();return;}
      const r=rows[i],d=document.createElement('tr');d.className='kdet';
      d.innerHTML=`<td colspan="${cols.length}" style="background:#fafcff;white-space:normal;text-align:left"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;font-size:13px">${DCOL.map(c=>`<div><span class="muted">${esc(c)}</span> <b style="float:right">${dval(c,r)}</b></div>`).join('')}</div><div style="margin-top:8px"><a href="https://wing.coupang.com/tenants/rfm-inventory/management/list" target="_blank" rel="noopener">Wing 재고현황에서 보기 →</a></div></td>`;
      tr.after(d);}});};
  draw();document.getElementById('kq').oninput=draw;document.getElementById('kh').onchange=draw;
  document.getElementById('segK').onclick=e=>{if(e.target.dataset.s===undefined)return;st=e.target.dataset.s;
    document.querySelectorAll('#segK button').forEach(b=>b.classList.toggle('on',b===e.target));draw()};
}

/* ═════════ 원가·마진 계산기 (관리자) ═════════ */
/* 원가·마진 계산 (사이트 화면과 Apps Script 서버가 같은 식을 씀) */
function cnum(v){ if(v===null||v===undefined) return 0; v=Number(String(v).replace(/,/g,'')); return isFinite(v)?v:0; }
function costCalc(it, b, batchItems){
  b = b || {}; batchItems = batchItems || [it];
  const r = {warn:[]};
  const qty = cnum(it.qty);
  const fx = cnum(it.fx) || cnum(b.fx);
  const agent = cnum(it.agent);   // 비워두면 0% (차수 기본값은 새 상품 만들 때만 채워 넣음)
  if(!fx) r.warn.push('환율');
  // 1) 상품가 (위안 → 원)
  r.goodsCny = cnum(it.cny) * (qty || 1) + cnum(it.ship);
  r.goods = qty ? (r.goodsCny * fx * (1 + agent/100)) / qty : cnum(it.cny) * fx * (1 + agent/100);
  // 2) 차수 공동비용 배분
  const total = (b.costs||[]).reduce((s,c)=>s+cnum(c.amount),0);
  r.batchTotal = total;
  if(!b.name) r.shared = 0;
  else if(b.alloc==='cbm'){
    const sum = batchItems.reduce((s,x)=>s+cnum(x.cbm)*cnum(x.qty),0);
    r.shared = (sum && qty) ? total * (cnum(it.cbm)*qty/sum) / qty : 0;
    if(total && !cnum(it.cbm)) r.warn.push('부피(CBM)');
  } else {
    const den = cnum(b.allocQty) || batchItems.reduce((s,x)=>s+cnum(x.qty),0);
    r.shared = den ? total/den : 0;
  }
  if(b.name && !total) r.warn.push('차수 공동비용');
  // 3) 부자재
  r.material = cnum(it.sticker) + cnum(it.pack);
  // 3-1) 관세 (상품값 × 관세율, 부가세는 환급되므로 제외)
  r.duty = cnum(it.cny) * fx * cnum(it.duty) / 100;
  r.unitBase = r.goods + r.shared + r.material + r.duty;
  // 4) 파손 반영 (실제 팔 수 있는 수량으로 나눔)
  const real = qty - cnum(it.dmg);
  r.unit = (qty && real > 0) ? r.unitBase * qty / real : r.unitBase;
  r.dmgCost = r.unit - r.unitBase;
  // 5) 쿠팡 입고비 (밀크런 / 파레트)
  // 차수 입고: 상품별 입고 방식(파레트/밀크런/나눠서) + 실은 수량
  const inMode=x=>{const v=x.inbound;if(v==='batch'||v==='bpallet'||v==='bmilk'||v==='bsplit')return b.inMode==='pallet'?'bpallet':'bmilk';return v};
  const inQ=x=>{const has=v=>v!==''&&v!=null;
    if(b.inMode==='pallet'&&has(x.palBox)&&['batch','bpallet','bmilk','bsplit'].includes(x.inbound))return {p:cnum(x.palBox)*cnum(x.perBox),m:0};   // 파레트 박스 수 × 박스당 입수
    const m=inMode(x),base=Math.max(0,cnum(x.qty)-cnum(x.dmg));
    return {p:m==='bpallet'?(has(x.inPal)?cnum(x.inPal):base):m==='bsplit'?cnum(x.inPal):0, m:m==='bmilk'?(has(x.inMilk)?cnum(x.inMilk):base):m==='bsplit'?cnum(x.inMilk):0}};
  const im=inMode(it);
  if(im==='bpallet'||im==='bmilk'||im==='bsplit'){
    const q=inQ(it), ptot=cnum(b.pallets)*cnum(b.palletFee), bf=cnum(b.boxFee)||4000;
    const its=batchItems.filter(x=>['bpallet','bmilk','bsplit','batch'].includes(x.inbound));
    const palSum=b.alloc==='cbm'?its.reduce((s,x)=>s+inQ(x).p*cnum(x.cbm),0):its.reduce((s,x)=>s+inQ(x).p,0);
    r.palUnit = palSum ? ptot*(b.alloc==='cbm'?cnum(it.cbm):1)/palSum : 0;   // 파레트로 보낸 1개당
    r.milkUnit = cnum(it.perBox) ? bf/cnum(it.perBox) : 0;                    // 밀크런으로 보낸 1개당
    r.palQ=q.p; r.milkQ=q.m; r.palSum=palSum; r.palTotal=ptot;
    r.inbound = (q.p+q.m) ? (q.p*r.palUnit + q.m*r.milkUnit)/(q.p+q.m) : 0;
    r.inLabel = im==='bpallet'?'차수 파레트':im==='bmilk'?'밀크런':'파레트+밀크런';
    if(q.p&&!ptot) r.warn.push('차수 파레트 요금');
    if(q.m&&!cnum(it.perBox)) r.warn.push('박스당 입수');
    if(im==='bsplit'&&!(q.p+q.m)) r.warn.push('파레트·밀크런 수량');
  } else if(it.inbound==='pallet'){
    const per = cnum(it.perPallet) || cnum(it.palletBoxes) * cnum(it.perBox);
    r.perPallet = per;
    r.inbound = per ? cnum(it.palletFee)/per : 0;
    if(!cnum(it.palletFee)||!per) r.warn.push('파레트 요금/수량');
  } else if(it.inbound==='direct'){
    r.inbound = cnum(it.inboundCost);
  } else if(it.inbound==='none'){
    r.inbound = 0;
  } else {
    r.inbound = cnum(it.perBox) ? cnum(it.boxFee)/cnum(it.perBox) : 0;
    if(!cnum(it.perBox)) r.warn.push('박스당 입수');
  }
  // 비교용: 밀크런·파레트 각각 개당 입고비
  r.cmpMilk = cnum(it.perBox) ? (cnum(it.boxFee)||4000)/cnum(it.perBox) : null;
  const pp = cnum(it.perPallet) || cnum(it.palletBoxes) * cnum(it.perBox);
  r.cmpPallet = (pp && cnum(it.palletFee)) ? cnum(it.palletFee)/pp : null;
  if(r.palUnit) r.cmpPallet = r.palUnit;
  if(r.milkUnit) r.cmpMilk = r.milkUnit;
  const set = cnum(it.set) || 1;
  r.set = set;
  r.landed = (r.unit + r.inbound) * set;           // 판매 1건당 원가 (= 원가 시트에 들어가는 값)
  // 6) 쿠팡 판매 비용
  const price = cnum(it.price), f = cnum(it.fee)/100;
  r.price = price;
  r.feeAmt = price * f;
  r.logi = cnum(it.shipFee) + cnum(it.whFee);
  r.etc = cnum(it.etc);
  r.margin1 = price - r.feeAmt - r.landed;
  r.margin = r.margin1 - r.logi - r.etc;
  r.rate = price ? r.margin/price : 0;
  // 부가세(대략): 매출세액 − 수수료·물류비에 포함된 매입세액
  r.vat = price/11 - (r.feeAmt + r.logi)/11;
  r.marginVat = r.margin - r.vat;
  r.rateVat = price ? r.marginVat/price : 0;
  const fixed = r.landed + r.logi + r.etc;
  r.breakEven = (1-f) > 0 ? fixed/(1-f) : 0;
  const t = cnum(it.target)/100;
  r.targetPrice = (1-f-t) > 0 ? fixed/(1-f-t) : 0;
  r.zeroRoas = r.margin > 0 ? price / r.margin * 100 : 0;
  // 7) 광고 시뮬레이션 (하루 기준 → 30일)
  const spend = cnum(it.adSpend), roas = cnum(it.adRoas)/100;
  r.adSales = spend * roas;
  r.adUnits = price ? r.adSales/price : 0;
  r.adProfit = r.adUnits * r.margin - spend;
  r.organic = cnum(it.organic);
  r.month = (r.adProfit + r.organic * r.margin) * 30;
  if(!price) r.warn.push('희망판매가');
  return r;
}

function fmtNum(v){if(v===''||v==null)return '';const t=String(v).replace(/,/g,'');if(!/^-?\d*\.?\d*$/.test(t))return String(v);
  const [a,b]=t.split('.');const ia=a.replace(/\B(?=(\d{3})+(?!\d))/g,',');return b!==undefined?ia+'.'+b:ia;}
function numv(v){v=String(v==null?'':v).replace(/,/g,'').trim();return v===''?'':(isFinite(Number(v))?Number(v):'');}
if(!window.__numFmt){window.__numFmt=1;document.addEventListener('input',e=>{const el=e.target;if(!el||!el.matches||!el.matches('input[data-num]'))return;
  const raw=el.value,pos=el.selectionStart||0;const keep=raw.slice(0,pos).replace(/[^\d.\-]/g,'').length;
  const clean=raw.replace(/[^\d.\-]/g,'');const f=fmtNum(clean);if(f===raw)return;el.value=f;
  let i=0,c=0;while(i<f.length&&c<keep){if(/[\d.\-]/.test(f[i]))c++;i++;}try{el.setSelectionRange(i,i)}catch(_){}},true);}

/* ═════════ 보증·교환 (SSD 등 보증 상품) ═════════ */
let WD=null;
const W_STATUS=['접수','회수 대기','회수 완료','교환 발송','완료','거절'];
const W_STCLS={'접수':'warn','회수 대기':'warn','회수 완료':'warn','교환 발송':'','완료':'ok','거절':'bad'};
const wn=v=>{v=Number(String(v==null?'':v).replace(/,/g,''));return isFinite(v)?v:0};
const wnum=n=>Math.round(n||0).toLocaleString('ko-KR');
function wToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wAddYears(s,y){const d=new Date(s.slice(0,10)+'T00:00:00');d.setFullYear(d.getFullYear()+Number(y||0));d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wDays(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function wItems(p){return WD.book.filter(it=>(p.items||[]).includes(it.name))}
function wOpts(p){const s=new Set();wItems(p).forEach(it=>(it.opts||[]).forEach(o=>s.add(String(o))));return s}
function wProdOfOpt(opt){return WD.products.find(p=>wOpts(p).has(String(opt)))||null}
function wBatchDate(n){const b=WD.batches.find(b=>b.name===n);if(b&&b.date)return b.date;const s=WD.serials.find(s=>s.batch===n&&s.date);return s?s.date:''}
function wSerials(p){return WD.serials.filter(s=>s.pid===p.id)}
function wSpare(p){const used=WD.exchanges.filter(x=>x.pid===p.id&&String(x.sent||'').trim()&&x.status!=='거절').length;return {inQ:wn(p.spareIn),used,now:wn(p.spareIn)-used}}

/* 선입선출: 먼저 들어온 차수부터 팔렸다고 보고 차수별 판매 기간·남은 수량·주문별 차수 추정 */
function wFifo(p){
  const map={};wItems(p).forEach(it=>{const k=it.batch||'(차수 없음)';map[k]=(map[k]||0)+Math.max(0,wn(it.qty)-wn(it.dmg))});
  const bs=Object.keys(map).map(n=>{const o=(p.batchIn||{})[n];return {name:n,date:wBatchDate(n),cost:map[n],inQty:o!==undefined&&o!==''?wn(o):map[n],sold:0,first:'',last:''}});
  bs.sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:a.name<b.name?-1:1);
  let over=0;const ob={};
  const take=(q,date,oid)=>{const used=[];while(q>0){const b=bs.find(b=>b.sold<b.inQty);if(!b){over+=q;break}
    const t=Math.min(q,b.inQty-b.sold);b.sold+=t;q-=t;if(date){if(!b.first)b.first=date;b.last=date}else if(!b.first)b.first='데이터 이전';used.push(b.name)}
    if(oid)ob[oid]=(ob[oid]||[]).concat(used.filter(x=>!(ob[oid]||[]).includes(x)))};
  take(wn(p.preSold),'',null);
  const opts=wOpts(p);let sold=wn(p.preSold);
  WD.sales.forEach(s=>{if(!opts.has(String(s[2])))return;take(s[3],String(s[0]).slice(0,10),String(s[1]));sold+=s[3]});
  bs.forEach(b=>b.remain=b.inQty-b.sold);
  return {bs,ob,over,sold,inTotal:bs.reduce((a,b)=>a+b.inQty,0)};
}
function wFindSerial(q){
  q=String(q||'').trim().toUpperCase();if(q.length<4)return [];
  const out=[];WD.serials.forEach(s=>(s.list||[]).forEach(r=>{const v=String(r[0]).toUpperCase();if(v===q||(q.length>=6&&v.includes(q)))out.push({p:WD.products.find(p=>p.id===s.pid),batch:s.batch,serial:r[0],mfg:r[1]||'',exact:v===q})}));
  return out.sort((a,b)=>b.exact-a.exact).slice(0,10);
}

async function wLookup(q){
  const box=$('wres');if(!q){box.innerHTML='';return}
  box.innerHTML='<div class="muted">찾는 중…</div>';
  const sers=wFindSerial(q);
  let orders=[];
  if(/^\d[\d\s-]{7,}$/.test(q)){try{orders=(await call('lookupOrder',TOKEN,q)).rows||[]}catch(e){box.innerHTML=`<div class="banner err">${esc(e.message)}</div>`;return}}
  const today=wToday();const parts=[];
  orders.forEach(o=>{
    const p=wProdOfOpt(o.opt);const date=String(o.time||o.date).slice(0,10);
    let verdict='<span class="pill">보증 상품 아님</span>',detail='';
    if(p){const end=wAddYears(date,p.years);const left=wDays(today,end);const f=wFifo(p);const bat=(f.ob[o.orderId]||[]);
      verdict=left>=0?`<span class="pill ok" style="font-size:15px;padding:4px 12px">보증 가능 · ${wnum(left)}일 남음</span>`:`<span class="pill bad" style="font-size:15px;padding:4px 12px">보증 만료 (${esc(end)})</span>`;
      detail=`<div class="r2"><span>보증 기간</span><b>${esc(date)} ~ ${esc(end)} (${esc(p.years)}년)</b></div>
${p.tbw?`<div class="r2"><span>TBW 기준</span><b>${esc(p.tbw)} (고객 SMART 정보로 확인)</b></div>`:''}`;}
    parts.push(`<div class="wres">${verdict}<div style="font-weight:700;margin-top:8px">${esc(o.name)} ${esc(o.option||'')}</div>
      <div class="r2"><span>주문번호</span><b>${esc(o.orderId)}</b></div><div class="r2"><span>구매일(결제)</span><b>${esc(o.time||o.date)}</b></div><div class="r2"><span>수량</span><b>${wnum(o.qty)}개</b></div>${detail}
      <button class="btn-ghost" style="margin-top:8px" data-exnew='${esc(JSON.stringify({orderId:o.orderId,pid:p?p.id:'',buy:date}))}'>이 주문으로 교환 접수</button></div>`)});
  sers.forEach(s=>{

function wModal(title,body,onSave,extra){

  document.body.appendChild(d);

function wLoadXlsx(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('엑셀 읽기 도구를 불러오지 못했어요'));document.head.appendChild(sc)})}
function wTemplate(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const L=[['입고일','입고배치(차수)','상품명','시리얼넘버','제품넘버','보증기간'],['예시) 2026-11-02','SSD 1차','US75 1TB','="00000000000000"','SP01KGBP44US7505','보증 5년']];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+L.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='시리얼_입력양식.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)}
function wDateStr(v){if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const m=String(v||'').trim().match(/(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/);return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):String(v||'').trim()}
function wParseRows(aoa){
  const norm=x=>String(x==null?'':x).replace(/\s|\?|\(|\)/g,'');
  let hi=aoa.findIndex(r=>r&&r.some(c=>/시리얼/.test(norm(c))));if(hi<0)return {err:'"시리얼넘버" 제목이 있는 줄을 찾지 못했어요. 양식을 받아 그대로 써 주세요.'};
  const H=aoa[hi].map(norm),col=re=>H.findIndex(h=>re.test(h));
  const c={date:col(/입고일/),batch:col(/차수|배치/),name:col(/상품명|상품/),serial:col(/시리얼/),model:col(/제품넘버|모델|제품번호/),years:col(/보증/)};
  if(c.serial<0||c.name<0||c.batch<0)return {err:'상품명·입고배치(차수)·시리얼넘버 칸이 꼭 있어야 해요.'};
  const rows=[],bad=[];
  aoa.slice(hi+1).forEach((r,i)=>{if(!r||!r.some(v=>String(v==null?'':v).trim()))return;
    if(r.some(v=>/예\s*시/.test(String(v==null?'':v))))return;   // 양식의 예시 줄은 건너뜀
    const g=k=>c[k]>=0?r[c[k]]:'';let ser=String(g('serial')==null?'':g('serial')).replace(/^=?"?|"?$/g,'').replace(/\s+/g,'');
    if(/^0+$/.test(ser))return;   // 예시용 0000… 시리얼은 건너뜀
    if(/e\+/i.test(ser)){bad.push(`${hi+i+2}번째 줄: 시리얼이 ${ser}처럼 깨져 있어요 (엑셀에서 텍스트로 바꿔 주세요)`);return}
    const name=String(g('name')||'').trim(),batch=String(g('batch')||'').trim();
    if(!ser||!name||!batch){bad.push(`${hi+i+2}번째 줄: 상품명·차수·시리얼 중 빈 칸`);return}
    const y=parseInt(String(g('years')||'').replace(/[^\d]/g,''))||0;
    rows.push({date:wDateStr(g('date')),batch,name,serial:ser,model:String(g('model')||'').trim(),years:y});});
  return {rows,bad};
}
async function wImport(){
  const d=wModal('엑셀로 한 번에 넣기',`<div class="muted" style="line-height:1.7">엑셀 칸: <b>입고일 · 입고배치(차수) · 상품명 · 시리얼넘버 · 제품넘버 · 보증기간</b> (첫 줄은 제목)<br>

    상품명이 원가·마진 품목 이름과 같으면 그 품목에 자동으로 연결돼요.</div>
    <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap"><label class="btn" style="cursor:pointer">엑셀 파일 고르기<input type="file" id="xf" accept=".xlsx,.xls,.csv" style="display:none"></label><button class="btn-ghost" id="xt">양식 받기</button></div>
    <div id="xr"></div>`,async d=>{if(!plan){toast('먼저 엑셀 파일을 골라 주세요');return false}await doSave(d);});

    toast(`넣었어요 · 시리얼 ${wnum(plan.addCount)}개`);await wReload();

function wPlan(rows){
  const all=new Map();WD.serials.forEach(s=>(s.list||[]).forEach(r=>all.set(String(r[0]).toUpperCase(),s)));
  const byName={};rows.forEach(r=>{(byName[r.name]=byName[r.name]||[]).push(r)});
  const names=new Set(WD.book.map(it=>it.name));const prods=[];let addCount=0,skip=0;const conflict=[];
  Object.keys(byName).forEach(name=>{const R=byName[name];const ex=WD.products.find(p=>p.name===name);
    const model=(R.find(r=>r.model)||{}).model||(ex&&ex.model)||'',years=(R.find(r=>r.years)||{}).years||(ex&&ex.years)||5;
    const items=[...new Set([...(ex&&ex.items||[]),...(names.has(name)?[name]:[])])];
    const pp={id:ex?ex.id:'',base:ex,name,model,years,items,isNew:!ex,changed:!ex||model!==(ex.model||'')||Number(years)!==Number(ex.years)||items.length!==(ex.items||[]).length,batches:[]};
    const byB={};R.forEach(r=>{(byB[r.batch]=byB[r.batch]||{batch:r.batch,date:r.date,rows:[]}).rows.push(r)});
    Object.values(byB).forEach(B=>{const cur=ex?(WD.serials.find(s=>s.pid===ex.id&&s.batch===B.batch)||{}).list||[]:[];const add=[];const seen=new Set();
      B.rows.forEach(r=>{const k=r.serial.toUpperCase();if(seen.has(k)){skip++;return}seen.add(k);const h=all.get(k);
        if(h){if(ex&&h.pid===ex.id&&h.batch===B.batch)skip++;else conflict.push(`${r.serial} (이미 ${(WD.products.find(p=>p.id===h.pid)||{}).name||'?'} · ${h.batch})`);return}
        add.push(r.serial)});
      addCount+=add.length;pp.batches.push({batch:B.batch,date:B.date,old:cur,add,count:B.rows.length})});
    prods.push(pp)});
  return {prods,addCount,skip,conflict,total:rows.length};
}

async function refreshData(){
  if(!TOKEN)return;
  toast('최신 자료를 받는 중…');
  try{
    const fresh=await call('getData',TOKEN);
    const same=JSON.stringify(fresh)===JSON.stringify(DATA);
    DATA=fresh;try{store.set('cd_data',JSON.stringify(fresh))}catch(e){}
    const y=window.scrollY;buildNav();show(TAB,'replace');window.scrollTo(0,y);
    toast(same?'바뀐 자료가 없어요 (마지막 업데이트: '+(DATA.updated||'-')+')':'최신 자료로 바꿨어요');
  }catch(e){toast('자료를 받지 못했어요: '+e.message)}
}
/* 업데이트: GitHub의 화면 파일(src/site.html)을 10분마다(그리고 화면으로 돌아올 때) 확인 → 새 버전이면
   업데이트 창을 맨 앞에 띄우고 10초 뒤 자동으로 바꿈 (KD마케팅업무도구처럼).
   계약서·보고서·비용을 쓰는 중이면 날아가지 않게 자동으로 넘기지 않고 [지금 업데이트]를 누를 때까지 기다림 */
const UPD={nv:'',snooze:0,last:0,t:null,typed:false,title:'',blink:null};
document.addEventListener('input',e=>{if(e.target&&e.target.closest&&e.target.closest('#main'))UPD.typed=true},true);
async function checkUpdate(manual){
  UPD.last=Date.now();
  try{
    const r=await fetch('src/site.html?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('화면 파일을 찾지 못했어요');
    const html=await r.text();
    const nv=(html.match(/const APP_VER='([^']+)'/)||[])[1]||'';
    let old=null;try{old=localStorage.getItem('cd_html');localStorage.setItem('cd_html',html)}catch(e){}
    // 지금 보고 있는 화면의 버전(APP_VER)과 GitHub 최신 화면의 버전을 비교 (버전이 없으면 저장본과 비교)
    if(nv?nv===APP_VER:old===html){if(manual)toast(`지금이 최신 화면이에요 (v${APP_VER})`);return;}
    if(manual)updGo();else updFront(nv);
  }catch(e){if(manual)toast('업데이트 확인 실패: '+e.message)}
}
function updGo(){try{sessionStorage.setItem('cd_upd_from',APP_VER)}catch(e){}location.reload()}
function updBusy(){   // 지금 바로 새로고침하면 쓰던 내용이 날아갈 수 있으면 그 이유
  if(typeof CDIRTY!=='undefined'&&CDIRTY)return '저장하지 않은 비용 내용이 있어요';
  if((typeof RP_BUSY!=='undefined'&&RP_BUSY>0)||(typeof CS_BUSY!=='undefined'&&CS_BUSY)||document.getElementById('csUpBox'))return '파일을 올리는 중이에요';
  if(UPD.typed&&TAB==='contract'&&typeof CT_MODE!=='undefined'&&((CT_MODE==='rep'&&RP_SUB==='new')||(CT_MODE!=='rep'&&CT_MODE!=='case'&&CT&&CT.sub==='new')))return '쓰는 중인 계약서·보고서가 있어요';
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.closest('#main'))return '입력하는 중이에요';
  return '';
}
function updTitle(on){   // 다른 창을 보고 있어도 알아보게: 탭 제목 깜빡이기
  clearInterval(UPD.blink);if(!UPD.title)UPD.title=document.title;
  if(!on){document.title=UPD.title;return}
  let f=false;UPD.blink=setInterval(()=>{f=!f;document.title=f?'🔄 새 버전이 나왔어요':UPD.title},1000);
}
function updFront(nv){
  if(Date.now()<UPD.snooze||document.getElementById('nvb'))return;UPD.nv=nv;
  // 창을 맨 앞으로: 창에 포커스 + 탭 제목 깜빡임 + (알림을 허용해 둔 PC면) 윈도우 알림 → 누르면 이 창이 앞으로
  try{window.focus()}catch(e){}updTitle(true);
  try{if('Notification' in window&&Notification.permission==='granted'&&(document.hidden||!document.hasFocus())){
    const n=new Notification('한국데이터 매출 대시보드',{body:`새 버전 ${nv?'v'+nv:''}이 나왔어요 · 눌러서 업데이트`,tag:'cd-upd',requireInteraction:true});
    n.onclick=()=>{try{window.focus()}catch(e){}n.close()}}}catch(e){}
  const d=document.createElement('div');d.id='nvb';d.className='modal';d.style.zIndex='9999';
  d.innerHTML=`<div class="login-card" style="text-align:center;max-width:340px"><div style="font-size:32px;line-height:1">🔄</div>
    <h3 style="margin:10px 0 6px;color:var(--ink)">새 버전 ${nv?'v'+esc(nv):''}이 나왔어요</h3>
    <p id="nvbMsg" style="color:var(--sub);font-size:14px;line-height:1.6;margin:0 0 14px"></p>
    <button class="btn fld-btn" id="nvbGo">지금 업데이트</button>
    <button class="btn-ghost" id="nvbLater" style="margin-top:8px;width:100%">나중에 (30분 뒤 다시 알림)</button></div>`;
  document.body.appendChild(d);
  let left=10;
  const draw=()=>{const busy=updBusy(),m=$('nvbMsg');if(!m)return busy;
    m.innerHTML=busy?`${busy}.<br>저장한 뒤 <b>[지금 업데이트]</b>를 눌러 주세요.`:`<b style="color:var(--ink);font-size:18px">${left}초</b> 뒤 자동으로 업데이트해요`;return busy};
  draw();
  $('nvbGo').onclick=updGo;
  $('nvbLater').onclick=()=>{clearInterval(UPD.t);UPD.snooze=Date.now()+30*60000;d.remove();updTitle(false)};
  clearInterval(UPD.t);UPD.t=setInterval(()=>{if(!document.getElementById('nvb')){clearInterval(UPD.t);return}
    if(draw()){left=10;return}if(--left<=0){clearInterval(UPD.t);updGo();return}draw()},1000);
}
function alertBox(html){
  const d=document.createElement('div');d.className='modal';
  d.innerHTML=`<div class="login-card" style="text-align:left"><p style="color:var(--ink);font-size:15px;line-height:1.6">${html}</p><button class="btn fld-btn">확인</button></div>`;
  d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);
}

/* 시작 */
initLogin();
(()=>{
  const t=store.get('cd_token');
  let me=null;try{me=JSON.parse(store.get('cd_me')||'null')}catch(e){}
  if(t&&me){TOKEN=t;ME=me;startApp();}   // 로그인 상태면 서버 확인을 기다리지 않고 바로 시작 (만료되면 자동 로그아웃)
  // 다음 접속을 빠르게: 최신 화면을 미리 받아 둠 (GitHub 주소에서 열었을 때)
  // GitHub에 올라온 최신 화면(src/site.html)을 미리 받아 두고, 바뀌었으면 안내
  if(!IN_GAS){setTimeout(()=>checkUpdate(false),2000);setInterval(()=>checkUpdate(false),10*60000);   // 켜 둔 동안 10분마다 새 버전 확인
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-UPD.last>2*60000)checkUpdate(false)});}
})();
</script>
